<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapid Orbit 6×6 | The Medic Goats</title><style>:root{--bg:#f4f1eb;--ink:#17130f;--muted:#6d675f;--line:#ddd6cc;--clay:#a66b48;--cream:#f1e7d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
main{max-width:720px;margin:auto;padding:18px 16px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:950;letter-spacing:.06em}
header a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
header a:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
.tag{font-size:10px;letter-spacing:.09em;border:1px solid #bdb1a2;border-radius:30px;padding:8px 11px;color:#62594e;background:#ebe5db;white-space:nowrap}
.intro{background:#fff;padding:18px;border:1px solid var(--line);border-radius:22px;margin:16px 0;box-shadow:0 7px 26px rgba(39,30,19,.035)}
h2{font-size:clamp(20px,4.5vw,27px);letter-spacing:-.035em;margin:0 0 7px}
.intro p{font-size:13px;color:var(--muted);line-height:1.55;margin:0}
button{background:var(--clay);color:#fff;border:1px solid #945c3b;border-radius:12px;padding:13px 24px;font-size:15px;font-weight:850;font-family:inherit;cursor:pointer;min-height:46px}
button:hover{background:#915837}button:focus-visible,.orbit:focus-visible{outline:3px solid #a66b48;outline-offset:3px}
[hidden]{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}
.stats span{display:block;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 5px;font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
#time{color:#925837}
.game-panel{background:#11131b;border:1px solid #33313d;border-radius:18px;padding:clamp(6px,1.6vw,13px);margin:12px 0;box-shadow:0 8px 24px rgba(39,30,19,.08)}
#board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(2px,.6vw,5px);width:100%;margin:0 auto}
.orbit{aspect-ratio:1;position:relative;border:1px solid #504b60;border-radius:50%;background:#171922;min-width:0;touch-action:manipulation;cursor:pointer}
.orbit:after{content:"";position:absolute;left:47%;top:47%;width:6%;height:6%;background:#6b7184;border-radius:50%}
.arm{position:absolute;inset:0;animation:spin var(--speed) linear infinite}
.arm.reverse{animation-direction:reverse}
.arm:before{content:"";position:absolute;top:2%;left:39%;width:22%;height:22%;border-radius:50%;background:#f9fafc;box-shadow:0 0 5px #fff,0 0 9px #ffffff88}
@keyframes spin{to{transform:rotate(360deg)}}
#message{min-height:25px;font-size:14px;font-weight:800;color:#55473b;margin:12px 0}
small{display:block;color:var(--muted);font-size:12px;margin-top:14px}
@media(max-width:420px){main{padding:10px 8px 24px}.game-panel{padding:5px}.stats{gap:6px}.stats span{font-size:11px;padding:11px 3px}header{font-size:11px}}.game-panel{padding:10px 6px}#board{gap:4px}.orbit{border-width:1px}.stats{gap:6px}.stats span{font-size:12px;padding:11px 3px}header{font-size:11px}}
.orbit.missed{border-color:#ef9c53;background:#55301f;box-shadow:0 0 0 2px #ef9c53,0 0 12px #f2a15d}.orbit.missed .arm{animation-play-state:running}.orbit.missed .arm:before{background:#ffb56d;box-shadow:0 0 9px #ffb56d}.orbit.found{border-color:#82d9a1;background:#244436;box-shadow:0 0 0 1px #82d9a1}.orbit.found .arm{animation-play-state:paused}.orbit.found:after{background:#82d9a1}</style><main><header><a href="/" aria-label="The Medic Goats home">THE MEDIC GOATS</a><span class="tag">RAPID ORBIT · 6×6</span></header><section class="intro"><h2>Find the backward circle</h2><p>Find every backward-spinning orbit. Each level adds another target. Your leftover time carries forward!</p></section><div class="stats"><span id="level">Level 1</span><span id="score">Found: 0/1 · 0 pts</span><span id="time">30.0s</span></div><p><button id="start">Start Game</button></p><p id="message">Ready?</p><section class="game-panel" aria-label="Rapid Orbit game board"><div id="board"></div></section><small>New game · The Medic Goats</small></main><script>const TOTAL=36,MAX_LEVEL=20,board=document.getElementById('board'),start=document.getElementById('start'),message=document.getElementById('message'),levelLabel=document.getElementById('level'),scoreLabel=document.getElementById('score'),timeLabel=document.getElementById('time');
let level=1,score=0,targets=new Set(),found=new Set(),deadline=0,timer=null,nextRound=null,active=false,remaining=0;
function stop(){active=false;clearInterval(timer);timer=null}
function update(){levelLabel.textContent='Level '+level;scoreLabel.textContent='Found: '+found.size+'/'+level+' · '+score.toLocaleString()+' pts';timeLabel.textContent=Math.max(0,remaining).toFixed(1)+'s'}
function finish(){stop();clearTimeout(nextRound);remaining=0;update();let missed=0;for(const i of targets){if(found.has(i))continue;const circle=board.children[i];if(circle){circle.classList.add('missed');circle.setAttribute('aria-label','Missed backward orbit '+(i+1))}missed++}message.textContent='Time up! '+missed+' missed backward '+(missed===1?'orbit':'orbits')+' highlighted in orange · Final score: '+score.toLocaleString();start.textContent='Play Again';start.hidden=false}
function tick(){if(!active)return;remaining=Math.max(0,(deadline-performance.now())/1000);update();if(remaining<=0)finish()}
function round(){stop();clearTimeout(nextRound);targets=new Set();found=new Set();while(targets.size<level)targets.add(Math.floor(Math.random()*TOTAL));board.replaceChildren();const fragment=document.createDocumentFragment();for(let i=0;i<TOTAL;i++){const circle=document.createElement('div');circle.className='orbit';circle.setAttribute('role','button');circle.setAttribute('tabindex','0');circle.setAttribute('aria-label','Orbit '+(i+1));const arm=document.createElement('div');arm.className='arm'+(targets.has(i)?' reverse':'');arm.style.setProperty('--speed',(1.45+Math.random()*3.7).toFixed(3)+'s');arm.style.animationDelay=(-Math.random()*5).toFixed(3)+'s';circle.append(arm);circle.addEventListener('click',()=>choose(i,circle));circle.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(i,circle)}});fragment.append(circle)}board.append(fragment);remaining+=30;deadline=performance.now()+remaining*1000;active=true;message.textContent='Find '+level+' backward '+(level===1?'orbit':'orbits')+'!';update();timer=setInterval(tick,40)}
function choose(i,circle){if(!active||found.has(i))return;tick();if(!active)return;if(!targets.has(i)){deadline-=1500;remaining=Math.max(0,(deadline-performance.now())/1000);message.textContent='Wrong orbit! −1.5 seconds';tick();return}found.add(i);deadline+=10000;remaining=Math.max(0,(deadline-performance.now())/1000);circle.classList.add('found');circle.setAttribute('aria-label','Found backward orbit '+(i+1));const earned=Math.round(100+Math.max(0,remaining)*30);score+=earned;update();if(found.size===level){stop();remaining=Math.max(0,(deadline-performance.now())/1000);update();if(level>=MAX_LEVEL){message.textContent='GOAT MODE COMPLETE! Final score: '+score.toLocaleString();start.textContent='Play Again';start.hidden=false;return}message.textContent='Level cleared! +10s per find · '+remaining.toFixed(1)+'s banked';level++;nextRound=setTimeout(round,650)}else{message.textContent='Correct! +10 seconds · '+(level-found.size)+' left to find'}}
start.onclick=()=>{clearTimeout(nextRound);stop();level=1;score=0;remaining=0;start.hidden=true;round()};</script></html>
