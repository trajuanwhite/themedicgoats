function generatePuzzle(){
 const topic=Number($('topic').value),target=Number($('level').value);
 let pool=topic<0?banks.flatMap(b=>b[1]):banks[topic][1];
 pool=[...new Map(pool.map(x=>[x[0],x])).values()];
 const seen=new Set(recentWords),fresh=shuffle(pool.filter(x=>!seen.has(x[0])));
 const stale=shuffle(pool.filter(x=>seen.has(x[0]))).sort((a,b)=>recentWords.lastIndexOf(a[0])-recentWords.lastIndexOf(b[0]));
 // Limit the candidate set so large banks do not slow down the browser.
 let candidates=fresh.length>=target+5?fresh:fresh.concat(stale);
 let next=build(candidates.slice(0,Math.max(25,target*3)),target);
 if(next.words.length<target&&fresh.length>=target){const alternative=build(shuffle(fresh).slice(0,Math.max(35,target*4)),target);if(alternative.words.length>next.words.length)next=alternative}
 for(const w of next.words){recentWords=recentWords.filter(x=>x!==w.answer);recentWords.push(w.answer)}
 recentWords=recentWords.slice(-250);try{localStorage.setItem(historyKey,JSON.stringify(recentWords))}catch{}

}

function startLocal(continuing=false){
 if(!setupReady())return;
 if(continuing!==true)resetSeries();$('nextRound').hidden=true;
 clearTimeout(cpuTimer);
 if(mode==='friends')return;
 $('gameArea').hidden=false;$('new').textContent='New Puzzle';
 players=mode==='cpu'?[{name:'You'},{name:'CPU'}]:[];
 loadPuzzle(generatePuzzle());
 update();
 $('check').textContent=mode==='solo'?'Check Puzzle':'Submit Word';
 $('hint').hidden=$('hintStat').hidden=mode!=='solo';
 $('raceScore').hidden=mode==='solo';
 if(mode==='cpu'){$('new').textContent='Restart Match';showSeries();paintClaims();queueCpu()}
}
function queueCpu(){
 clearTimeout(cpuTimer);
 if(finished)return;
 const delay=Number($('level').value)===6?19000:Number($('level').value)===10?9000:14000;
 cpuTimer=setTimeout(()=>{
  const open=puzzle.words.filter(w=>w.owner==null);
  if(mode!=='cpu'||finished||!open.length)return;
  const word=open[Math.floor(Math.random()*open.length)];
  word.owner=1;
  $('status').textContent='CPU solved '+word.num+' '+(word.d==='A'?'Across':'Down')+'.';
  paintClaims();
  queueCpu();
 },delay+Math.random()*4500);
}
function paintClaims(){
 const counts=players.map(()=>0);
 const shared=new Map();
 for(const word of puzzle.words){
  if(word.owner==null)continue;
  counts[word.owner]++;
  word.button.classList.add('claimed');
  word.button.style.setProperty('--owner',colors[word.owner]);
  word.button.setAttribute('aria-label',word.clue+' — solved by '+players[word.owner].name);
  word.positions.forEach((k,i)=>{
   const field=inputs.get(k);
   field.value=word.answer[i];
   field.readOnly=true;
   field.parentElement.classList.remove('wrong','correct');
   const owners=shared.get(k)||new Set();
   owners.add(colors[word.owner]);
   shared.set(k,owners);
  });
 }
 for(const [k,owners] of shared){
  const palette=[...owners],cell=inputs.get(k).parentElement;
  cell.classList.add('claimed');
  cell.style.setProperty('--owners',palette.length===1?palette[0]:
   'linear-gradient(135deg,'+palette[0]+' 50%,'+palette[1]+' 50%)');
 }
 $('raceScore').hidden=false;
 $('raceScore').replaceChildren(...players.map((p,i)=>{
  const item=document.createElement('span');
  item.style.setProperty('--owner',colors[i]);
  item.textContent=p.name+' · '+counts[i];
  return item;
 }));
 const solved=counts.reduce((a,b)=>a+b,0);
 $('progress').textContent=solved+' / '+puzzle.words.length;
 if(solved===puzzle.words.length&&!finished){
  finishTime=Date.now();finished=true;tick();clearInterval(timer);clearTimeout(cpuTimer);
  const high=Math.max(...counts);
  const winners=players.filter((_,i)=>counts[i]===high).map(p=>p.name);
  $('status').textContent=(winners.length>1?'Tie: ':'Winner: ')+winners.join(' and ')+' · '+$('time').textContent;
  if(mode==='cpu'){if(winners.length===1)wins[counts.indexOf(high)]++;seriesOver=Math.max(...wins)>=3||round>=5;showSeries();$('status').textContent+=(seriesOver?' · Match '+(wins[0]===wins[1]?'draw':(wins[0]>wins[1]?'winner: You':'winner: CPU')):' · Round complete');$('nextRound').textContent=seriesOver?'Play Again':'Next Round';$('nextRound').hidden=false;}
  $('status').className='win';
  for(const field of inputs.values())field.readOnly=true;
  $('check').disabled=$('clear').disabled=true;
 }
}
async function rpc(action,args={}){
 if(!db)throw Error('Multiplayer is unavailable. Reload and try again.');
 const {data,error}=await db.rpc('medic_crossword_race',{p_action:action,p_code:room?.code??null,p_token:room?.token??null,...args});
 if(error)throw Error(error.message);
 return data;
}
function roomPuzzle(entries){
 const cells=new Map();
 const words=entries.map((entry,id)=>{
  const positions=[];
  for(let i=0;i<entry.length;i++){
   const r=entry.r+(entry.d==='D'?i:0),c=entry.c+(entry.d==='A'?i:0);
   const k=key(r,c);
   positions.push(k);cells.set(k,{r,c});
  }
  return {...entry,id,positions,owner:null,answer:' '.repeat(entry.length)};
 });
 return {cells,words};
}
function receive(state){
 $('roomTitle').textContent='Room '+state.code;
 $('roomStatus').textContent=state.started?'':state.players.map(p=>p.name).join(' · ');
 $('startRace').hidden=state.me!==0||state.started;
 $('startRace').disabled=state.players.length<2;
 players=state.players;
 if(!state.started)return;
 if(!room.started){
  room.started=true;
  $('gameArea').hidden=false;
  loadPuzzle(roomPuzzle(state.entries));
  $('hint').hidden=$('hintStat').hidden=true;
  $('check').textContent='Submit Word';
 }
 if(finished)return;
 started=Date.now()-state.elapsedMs;
 for(const word of puzzle.words){
  const entry=state.entries[word.id];
  if(entry.owner!=null){word.owner=entry.owner;word.answer=entry.answer}
 }
 paintClaims();
}
async function submitWord(explicit){
 if(finished||!active||busy)return;
 const word=active;
 if(word.owner!=null){if(explicit)$('status').textContent='That word has already been claimed.';return}
 const guess=word.positions.map(k=>inputs.get(k).value).join('');
 if(guess.length!==word.positions.length){
  if(explicit)$('status').textContent='Fill in the selected word first.';
  return;
 }
 const attempt=word.num+word.d+':'+guess;
 if(!explicit&&attempt===lastAttempt)return;
 lastAttempt=attempt;
 if(mode==='cpu'){
  if(guess===word.answer){
   word.owner=0;$('status').textContent='Word claimed!';paintClaims();
  }else $('status').textContent='Try another answer.';
  return;
 }
 if(!room?.started)return;
 busy=true;revision++;
 const current=generation;
 try{
  const state=await rpc('claim',{p_word:word.id,p_guess:guess});
  if(current!==generation)return;
  receive(state);
  if(!state.ended)$('status').textContent=state.outcome==='correct'?'Word claimed!':
   state.outcome==='taken'?'That word was already claimed.':'Try another answer.';
 }catch(e){if(current===generation){lastAttempt='';$('status').textContent=e.message}}
 finally{if(current===generation){busy=false;if(lastAttempt)submitWord(false)}}
}
async function refreshRoom(){
 if(!room||busy||polling)return;
 polling=true;const current=generation,version=revision;
 try{const state=await rpc('state');if(current===generation&&version===revision)receive(state)}
 catch(e){if(current===generation)$('roomStatus').textContent=e.message}
 finally{polling=false}
}
async function enterRoom(action){
 if(busy||(action==='host'&&!setupReady()))return;
 busy=true;
 const current=generation;
 try{
  const args={p_name:$('raceName').value.trim()};
  if(action==='host')args.p_entries=generatePuzzle().words.map(({r,c,d,clue,answer})=>({r,c,d,clue,answer}));
  else{
   args.p_code=$('raceCode').value.trim();
   if(!/^\d{6}$/.test(args.p_code))throw Error('Enter the six-digit room code.');
  }
  const state=await rpc(action,args);
  if(current!==generation)return;
  room={code:state.code,token:state.token,started:false};
  $('roomSetup').hidden=true;$('roomLobby').hidden=false;
  receive(state);
  pollTimer=setInterval(refreshRoom,750);
 }catch(e){if(current===generation)$('roomStatus').textContent=e.message}
 finally{if(current===generation)busy=false}
}
function setupReady(){return !!($('playMode').value&&$('topic').value&&$('level').value)}
function updateSetup(){const ready=setupReady();$('new').disabled=!ready;$('hostRace').disabled=!ready;}
function changeMode(){
 generation++;room=null;busy=false;lastAttempt='';
 clearInterval(pollTimer);clearInterval(timer);clearTimeout(cpuTimer);
 mode=$('playMode').value;resetSeries();
 const friends=mode==='friends';
 $('friendsPanel').hidden=!friends;$('gameArea').hidden=true;
 $('roomSetup').hidden=false;$('roomLobby').hidden=true;$('roomStatus').textContent='';
 $('new').hidden=friends;
 $('copyRace').textContent='Copy Invite';
 $('new').textContent='Start Game';updateSetup();
}
$('playMode').onchange=changeMode;
$('topic').onchange=$('level').onchange=()=>{if(mode!=='friends'&&!$('gameArea').hidden)changeMode();else updateSetup();};
$('hostRace').onclick=()=>enterRoom('host');
$('joinRace').onclick=()=>enterRoom('join');
$('leaveRace').onclick=changeMode;
$('startRace').onclick=async()=>{
 if(busy)return;
 busy=true;revision++;const current=generation;
 try{const state=await rpc('start');if(current===generation)receive(state)}
 catch(e){if(current===generation)$('roomStatus').textContent=e.message}
 finally{if(current===generation)busy=false}
};
$('copyRace').onclick=async()=>{
 const invite=new URL(location.href);
 invite.searchParams.set('race',room.code);
 try{await navigator.clipboard.writeText(invite.href);$('copyRace').textContent='Invite Copied'}
 catch{$('roomStatus').textContent='Share room code '+room.code;}
};
const invite=new URLSearchParams(location.search).get('race');
if(/^\d{6}$/.test(invite||'')){
 $('playMode').value='friends';$('raceCode').value=invite;
}
changeMode();

</script></body></html>
