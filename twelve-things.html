<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>12 Things | Couples Game Night</title>
<style>
:root { font: 16px system-ui,sans-serif; color: #25221c; background: #f4f1eb; }
* { box-sizing: border-box; }
main { max-width: 620px; margin: auto; padding: 22px 16px 40px; }
a { color: #354e3c; }
h1 { font: 700 clamp(48px,10vw,76px) Georgia,serif; margin: 12px 0; letter-spacing: -.05em; }
h2,p { margin: 0 0 12px; }
section { background: #fff; border: 1px solid #ded8cc; border-radius: 20px; padding: 16px; margin-top: 16px; }
label { display: block; font-weight: 650; margin-bottom: 12px; }
input,select,button { font: inherit; min-height: 44px; padding: 8px 12px; border-radius: 8px; border: 1px solid #958e81; }
input,select { display: block; width: 100%; margin-top: 5px; background: #fff; }
button { background: #27483a; color: #fff; border: 0; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.prompt { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
#clock { font-size: 28px; font-weight: 750; font-variant-numeric: tabular-nums; }
canvas { display: block; width: 100%; aspect-ratio: 4/3; max-height: 52dvh; border: 1px solid #958e81; border-radius: 10px; background: white; touch-action: none; }
.palette { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 8px; }
.swatch { display: grid; place-items: center; width: 44px; padding: 0; background: transparent; }
.swatch::before { content: ""; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); border: 1px solid #25221c55; }
.swatch[aria-pressed="true"]::before { outline: 2px solid #25221c; outline-offset: 3px; }
#status { margin-top: 12px; }
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="/twelve-things.js?v=colors"></script>
</head>
<body><main>
<a href="/couples-games.html">← Couples Games</a>
<h1>12 Things</h1>
<p>Draw 12 things against the clock. Then use your sketches to remember what they were.</p>
<section id="game" aria-label="Game"></section>
<p id="status" role="status"></p>
</main></body>
</html>
