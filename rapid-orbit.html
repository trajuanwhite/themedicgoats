<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapid Orbit | The Medic Goats</title><style>:root{--bg:#f4f1eb;--ink:#17130f;--muted:#6d675f;--line:#ddd6cc;--clay:#a66b48;--cream:#f1e7d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
main{max-width:650px;margin:auto;padding:18px 16px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:950;letter-spacing:.06em}
header a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
header a:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
.tag{font-size:10px;letter-spacing:.09em;border:1px solid #bdb1a2;border-radius:30px;padding:8px 11px;color:#62594e;background:#ebe5db;white-space:nowrap}
.intro{background:#fff;padding:18px;border:1px solid var(--line);border-radius:22px;margin:16px 0;box-shadow:0 7px 26px rgba(39,30,19,.035)}
h2{font-size:clamp(20px,4.5vw,27px);letter-spacing:-.035em;margin:0 0 7px}
.intro p{font-size:13px;color:var(--muted);line-height:1.55;margin:0}
button{background:var(--clay);color:#fff;border:1px solid #945c3b;border-radius:12px;padding:13px 24px;font-size:15px;font-weight:850;font-family:inherit;cursor:pointer;min-height:46px}
button:hover{background:#915837}button:focus-visible,.orbit:focus-visible{outline:3px solid #a66b48;outline-offset:3px}
[hidden]{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}
.stats span{display:block;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 5px;font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
#time{color:#925837}
.game-panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 10px;margin:12px 0;box-shadow:0 8px 24px rgba(39,30,19,.04)}
#board{display:grid;gap:7px;max-width:610px;margin:10px auto}
.orbit{aspect-ratio:1;position:relative;border:2px solid #d4c3b1;border-radius:50%;background:#faf7f1;min-width:0;touch-action:manipulation;cursor:pointer}
.orbit:after{content:'';position:absolute;left:45%;top:45%;width:10%;height:10%;background:#a66b48;border-radius:50%}
.arm{position:absolute;inset:0;animation:spin var(--speed) linear infinite}
.arm.reverse{animation-direction:reverse}
.arm:before{content:'';position:absolute;top:6%;left:41%;width:18%;height:18%;border-radius:50%;background:#a66b48}
@keyframes spin{to{transform:rotate(360deg)}}
#message{min-height:25px;font-size:14px;font-weight:800;color:#55473b;margin:12px 0}
small{display:block;color:var(--muted);font-size:12px;margin-top:14px}
@media(max-width:420px){main{padding:10px 10px 24px}.game-panel{padding:10px 6px}#board{gap:4px}.orbit{border-width:1px}.stats{gap:6px}.stats span{font-size:12px;padding:11px 3px}header{font-size:11px}}
@media(prefers-reduced-motion:reduce){.arm{animation-duration:calc(var(--speed) * 2)}}</style><main><header><a href="/" aria-label="The Medic Goats home">THE MEDIC GOATS</a><span class="tag">RAPID ORBIT</span></header><section class="intro"><h2>Find the backward circle</h2><p>Only one orbit moves in the opposite direction. Tap it as fast as you can!</p></section><div class="stats"><span id="level">Level 1</span><span id="score">Score: 0</span><span id="time">10.0s</span></div><p><button id="start">Start Game</button></p><p id="message">Ready?</p><section class="game-panel" aria-label="Rapid Orbit game board"><div id="board"></div></section><small>New game · The Medic Goats</small></main><script>const counts=[6,12,20,35,50,70,90,120,150,180],board=document.getElementById('board'),start=document.getElementById('start'),message=document.getElementById('message');let level=0,score=0,correct=-1,deadline=0,timer=null,active=false;function end(){active=false;clearInterval(timer)}function round(){end();const count=counts[level];correct=Math.floor(Math.random()*count);board.replaceChildren();board.style.gridTemplateColumns='repeat('+Math.ceil(Math.sqrt(count*1.25))+',minmax(0,1fr))';document.getElementById('level').textContent='Level '+(level+1);document.getElementById('score').textContent='Score: '+score;for(let i=0;i<count;i++){const circle=document.createElement('div');circle.className='orbit';circle.setAttribute('role','button');circle.setAttribute('aria-label','Circle '+(i+1));const arm=document.createElement('div');arm.className='arm'+(i===correct?' reverse':'');arm.style.setProperty('--speed',Math.max(1.7,3.4-level*.13)+'s');circle.append(arm);circle.onclick=()=>choose(i);board.append(circle)}message.textContent='Find the backward orbit!';deadline=performance.now()+10000;active=true;timer=setInterval(()=>{const left=Math.max(0,(deadline-performance.now())/1000);document.getElementById('time').textContent=left.toFixed(1)+'s';if(left<=0){end();message.textContent='Time up! Score: '+score;start.textContent='Try Again';start.hidden=false}},50)}function choose(i){if(!active)return;if(i!==correct){deadline-=1500;message.textContent='Wrong circle! −1.5 seconds';return}const earned=Math.round(100+Math.max(0,(deadline-performance.now())/1000)*90);score+=earned;end();message.textContent='Correct! +'+earned+' points';if(level===counts.length-1){message.textContent='GOAT MODE COMPLETE! Final score: '+score;start.textContent='Play Again';start.hidden=false}else{level++;setTimeout(round,700)}}start.onclick=()=>{level=0;score=0;start.hidden=true;round()};</script></html>
