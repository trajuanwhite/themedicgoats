<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>After Hours · Just Us Two</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f8ece9;background:#190f17}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#58303e,transparent 55%),#190f17;min-height:100vh}main{max-width:650px;margin:auto;padding:35px 18px 80px;text-align:center}h1{font-family:Georgia,serif;font-size:clamp(52px,12vw,90px);font-weight:400;line-height:.95;margin:20px 0}h1 em{color:#e8a8b4}p{color:#d9bdc6;line-height:1.6}.eyebrow{letter-spacing:.24em;text-transform:uppercase;font-size:11px;font-weight:800;color:#f0b9c6}.card{background:#ffffff0c;border:1px solid #ffffff27;border-radius:24px;padding:27px;margin:24px 0;box-shadow:0 20px 60px #0002}button,input{font:inherit;border-radius:13px;padding:15px;border:1px solid #ffffff30}input{background:#ffffff12;color:white;width:100%;margin:10px 0;text-align:center}button{background:#e8a8b4;color:#27141d;font-weight:800;cursor:pointer;margin:5px;min-height:48px}button:disabled{opacity:.4;cursor:default}.secondary{background:transparent;color:#f5d8de}.tiny{font-size:13px}.hide{display:none}.challenge{font-family:Georgia,serif;font-size:clamp(26px,6vw,39px);line-height:1.3;color:#fff;margin:32px 0}.progress{height:7px;border-radius:9px;background:#ffffff20;overflow:hidden}.progress>div{height:100%;background:#e8a8b4;transition:width .3s}.names{display:flex;justify-content:center;gap:14px;font-weight:800}.code{font-size:33px;letter-spacing:.18em;font-weight:900;overflow-wrap:anywhere}.round{font-size:13px;text-transform:uppercase;letter-spacing:.17em;color:#efb6c2;font-weight:800}.status{min-height:24px;color:#f5c3cc}.controls{display:flex;flex-wrap:wrap;justify-content:center}.back{color:#e9bac6;text-decoration:none;font-size:13px}.card button{max-width:100%}</style></head><body><main><a class="back" href="/couples-games.html">← Couples Games</a><div class="eyebrow" style="margin-top:28px">Private date night · Two players</div><h1>AFTER <em>HOURS.</em></h1><p>Know Me or Show Me · Guess right, they do the task. Guess wrong, you do.</p><div id="app"></div><p id="notice" class="status" role="status"></p></main><script>
const db=supabase.createClient('https://jjzjqjvdnaeuftptvmyw.supabase.co','sb_publishable_QPQY6u-wJBKULuaEgsG4lA_KiWCwhN4');
const QUESTIONS=[["Your ideal romantic night?","Dinner out and dressing up","A cozy movie night","A spontaneous adventure","Music and quality time"],["What makes you feel most appreciated?","Thoughtful words","Undivided attention","Help with everyday things","Physical affection"],["Which date would you pick?","Rooftop dinner","Picnic at sunset","Couples spa day","Concert or live show"],["Your favorite way to unwind together?","Talking on the couch","A relaxing massage","Cooking together","Watching a favorite show"],["What kind of surprise would you love?","A planned weekend trip","A handwritten note","A surprise date","A favorite treat"],["Which is most romantic?","A long hug","A lingering kiss","A slow dance","A meaningful conversation"],["What matters most on a date?","Good food","Feeling connected","Doing something new","Laughing together"],["Your perfect weekend morning?","Sleep in together","Breakfast in bed","Go somewhere new","Get up and be productive"],["What kind of compliment hits hardest?","How I look","How I make you feel","My personality","What I accomplish"],["Which getaway sounds best?","Beach resort","Cabin in the mountains","Big-city hotel","Quiet countryside"],["Your favorite way to show affection?","Holding hands","Kissing","Giving a massage","Planning something thoughtful"],["What's your dream dinner setting?","Candlelit restaurant","Home-cooked meal","Outdoor patio","Room service"],["What would you rather receive?","Flowers or a small gift","A thoughtful message","A planned date","Extra time together"],["What is your favorite shared activity?","Trying new restaurants","Traveling","Staying in","Dancing"],["What kind of evening energy do you prefer?","Playful and funny","Relaxed and cozy","Fancy and romantic","Spontaneous"],["Which small gesture wins you over?","A surprise hug","A check-in text","A favorite snack","An unexpected kiss"],["Which movie-night setup?","Comedy and snacks","Romance and blankets","Thriller and popcorn","Skip the movie and talk"],["What makes you feel closest?","Laughing together","Deep conversations","Affectionate touch","Shared adventures"],["How would you spend an unexpected free hour?","Go on a mini date","Cuddle and relax","Take a walk","Do something fun"],["Which soundtrack fits your perfect date?","R&B","Old-school love songs","Jazz","Our favorite playlist"],["What's your preferred celebration?","Nice dinner","Weekend getaway","Small thoughtful surprise","Quiet night together"],["Which feels most exciting?","Trying a new activity","Revisiting a favorite spot","A surprise plan","A spontaneous drive"],["How do you prefer to reconnect after a long day?","A hug and conversation","Quiet time side by side","A massage","A shared meal"],["What would make tonight memorable?","Lots of laughter","Romantic atmosphere","A thoughtful surprise","Uninterrupted time"],["Which would you pick for a couple's challenge?","Slow dance","Give a massage","Exchange compliments","Share a kiss"]];
const TASKS=["Give your partner a gentle shoulder massage.","Share a lingering kiss, if you both want to.","Hold your partner in a warm embrace.","Slow dance together.","Give your partner a hand massage.","Let your partner choose a comfortable affectionate gesture.","Give your partner a relaxing upper-back massage.","Sit close and hold hands while making eye contact.","Give your partner a gentle forehead kiss.","Offer your partner a relaxing neck massage."];
const app=document.getElementById('app'),notice=document.getElementById('notice');
let me=null,room=null,host=false,channel=null,connected=false,other=false,state=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function randomCode(){const a=new Uint8Array(18);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}
function noticeText(s){notice.textContent=s}
function send(type,payload={}){return channel?.send({type:'broadcast',event:'game',payload:{type,from:me,...payload}})}
function newState(){return {order:shuffle(QUESTIONS.map((_,i)=>i)).slice(0,20),index:0,phase:'answer',answer:null,guess:null,task:null,performer:null,done:false}}
function push(){send('state',{state});render()}
function connect(code){room=code;const u=new URL(location.href);u.searchParams.set('room',code);history.replaceState(null,'',u);channel=db.channel('afterhours-'+code,{config:{broadcast:{self:false,ack:true}}});channel.on('broadcast',{event:'game'},({payload:p})=>{if(p.from===me)return;if(p.type==='hello'){other=true;send('hello-back');if(host&&state)send('state',{state});render()}if(p.type==='hello-back'){other=true;if(host&&state)send('state',{state});render()}if(p.type==='state'&&!host){state=p.state;other=true;render()}if(p.type==='answer'&&host&&state.phase==='answer'&&p.from===answerer()){state.answer=p.value;state.phase='guess';push()}if(p.type==='guess'&&host&&state.phase==='guess'&&p.from===guesser()){finishGuess(p.value)}if(p.type==='next-request'&&host&&state.phase==='task'){advance()}if(p.type==='swap-request'&&host&&state.phase==='task'){state.task=pick(TASKS.filter(t=>t!==state.task));push()}}).subscribe(status=>{if(status==='SUBSCRIBED'){connected=true;send('hello');render();noticeText('Room connected')}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')noticeText('Connection interrupted. Refresh to reconnect.')})}
function create(name){me=name;host=true;state=newState();connect(randomCode())}
function join(name,code){me=name;host=false;connect(code)}
function answerer(){return state.index%2===0?'Iesha':'Tra'}
function guesser(){return answerer()==='Iesha'?'Tra':'Iesha'}
function question(){return QUESTIONS[state.order[state.index]]}
function finishGuess(value){if(!host||state.phase!=='guess')return;state.guess=value;state.performer=value===state.answer?answerer():guesser();state.task=pick(TASKS);state.phase='task';push()}
function chooseAnswer(v){if(state.phase!=='answer'||me!==answerer())return;if(host){state.answer=v;state.phase='guess';push()}else{send('answer',{value:v});noticeText('Answer submitted. Waiting for your partner to guess.');app.querySelectorAll('button[data-choice]').forEach(b=>b.disabled=true)}}
function chooseGuess(v){if(state.phase!=='guess'||me!==guesser())return;if(host)finishGuess(v);else{send('guess',{value:v});noticeText('Guess submitted. Waiting for the reveal.');app.querySelectorAll('button[data-choice]').forEach(b=>b.disabled=true)}}
function advance(){if(!host||state.phase!=='task')return;state.index++;if(state.index>=state.order.length)state.phase='complete';else{state.phase='answer';state.answer=null;state.guess=null;state.task=null;state.performer=null}push()}
function swap(){if(host){state.task=pick(TASKS.filter(t=>t!==state.task));push()}else send('swap-request')}
function showQR(){const el=document.getElementById('room-qr');if(!el)return;if(typeof window.QRCode!=='function'){el.textContent='QR unavailable — use Copy Invite Link below.';return}try{el.innerHTML='';new QRCode(el,{text:location.href,width:208,height:208,colorDark:'#27141d',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent='QR unavailable — use Copy Invite Link below.'}}
function render(){if(!connected)return;if(!state){app.innerHTML='<div class="card"><h2>Waiting for your partner…</h2><p>Keep this page open while your partner starts the game.</p></div>';return}if(state.phase==='complete'){app.innerHTML='<div class="card"><h2>That’s a wrap ❤️</h2><p>20 questions complete. Ready for another round?</p>'+(host?'<button id="again">Play Again</button>':'<p>Ask the room creator to restart.</p>')+'</div>';document.getElementById('again')?.addEventListener('click',()=>{state=newState();push()});return}
const a=answerer(),g=guesser(),q=question();let body='';
if(state.phase==='answer'){body='<h2>'+esc(a)+' answers privately</h2><p>'+(me===a?'Choose the answer that fits you best. Your partner cannot see your selection until the reveal.':'Waiting for '+esc(a)+' to answer on their phone.')+'</p>'+(me===a?'<div class="challenge">'+esc(q[0])+'</div>'+choices(q):'')}
if(state.phase==='guess'){body='<h2>'+esc(g)+' guesses</h2><p>'+(me===g?'Which option did '+esc(a)+' choose?':'Your answer is locked. Waiting for '+esc(g)+' to guess.')+'</p>'+(me===g?'<div class="challenge">'+esc(q[0])+'</div>'+choices(q):'')}
if(state.phase==='task'){const correct=state.guess===state.answer;body='<div class="round">'+(correct?'Correct guess!':'Not quite!')+'</div><h2>'+esc(state.performer)+' does the task</h2><p>'+esc(a)+' chose: <strong>'+esc(q[state.answer+1])+'</strong></p><p>'+esc(g)+' guessed: <strong>'+esc(q[state.guess+1])+'</strong></p><div class="challenge">'+esc(state.task)+'</div><p>30 seconds · Start when you’re both ready. Either person may pass.</p><div id="clock" class="code">30</div><div class="controls"><button id="start-clock">Start 30 Seconds</button><button id="swap" class="secondary">Swap Task</button></div>'+(host?'<button id="next">Next Question →</button>':'<button id="next-request" class="secondary">Ask to Continue →</button>')}
app.innerHTML='<div class="card">'+(host?'<div style="padding:14px;margin-bottom:18px;border:1px solid #ffffff30;border-radius:18px"><div class="round">Scan to Join</div><p class="tiny">Have your partner scan this code with their phone camera.</p><div id="room-qr" style="display:flex;justify-content:center;align-items:center;margin:auto;width:224px;min-height:224px;max-width:100%;background:white;color:#27141d;border-radius:12px;padding:8px"></div><details style="margin-top:12px"><summary>Or share an invite link</summary><input id="invite" readonly value="'+esc(location.href)+'"><button id="copy">Copy Invite Link</button></details></div>':'')+'<div class="round">Question '+(state.index+1)+' of 20 · '+esc(a)+'’s turn</div><div class="progress"><div style="width:'+((state.index+1)/20*100)+'%"></div></div>'+body+'</div>';
showQR();app.querySelectorAll('button[data-choice]').forEach(b=>b.addEventListener('click',()=>state.phase==='answer'?chooseAnswer(Number(b.dataset.choice)):chooseGuess(Number(b.dataset.choice))));
document.getElementById('copy')?.addEventListener('click',()=>navigator.clipboard.writeText(location.href).then(()=>noticeText('Invite link copied')));
document.getElementById('next')?.addEventListener('click',advance);
document.getElementById('next-request')?.addEventListener('click',()=>{send('next-request');noticeText('Asked your partner to continue.')});
document.getElementById('swap')?.addEventListener('click',swap);
document.getElementById('start-clock')?.addEventListener('click',()=>{const b=document.getElementById('start-clock');b.disabled=true;const clock=document.getElementById('clock');const end=Date.now()+30000;const id=setInterval(()=>{if(!clock.isConnected){clearInterval(id);return}const remaining=Math.max(0,Math.ceil((end-Date.now())/1000));clock.textContent=remaining||'Time!';if(!remaining)clearInterval(id)},200)});
}
function choices(q){return '<div style="display:grid;gap:9px;margin:20px 0">'+q.slice(1).map((v,i)=>'<button class="secondary" data-choice="'+i+'" style="text-align:left">'+String.fromCharCode(65+i)+'. '+esc(v)+'</button>').join('')+'</div>'}
function setup(){app.innerHTML='<div class="card"><h2>Know Me or Show Me</h2><p>20 questions. Take turns answering about yourselves, guessing each other’s choices, and completing 30-second challenges.</p><button id="tra">I’m Tra · Create Room</button><button id="iesha">I’m Iesha · Create Room</button></div>';document.getElementById('tra').onclick=()=>create('Tra');document.getElementById('iesha').onclick=()=>create('Iesha')}
const code=new URLSearchParams(location.search).get('room');if(code&&/^[a-f0-9]{36}$/.test(code)){app.innerHTML='<div class="card"><h2>Join your partner</h2><p>Who is playing on this phone?</p><button id="join-tra">Tra</button><button id="join-iesha">Iesha</button></div>';document.getElementById('join-tra').onclick=()=>join('Tra',code);document.getElementById('join-iesha').onclick=()=>join('Iesha',code)}else setup();
</script></body></html>
