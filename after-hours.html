emistry, affection, and anticipation.</p><div id="app"></div><p id="notice" class="status" role="status"></p></main><script>

our partner choose the next affectionate gesture, with no pressure."],["Ask your partner what they want more of tonight: closeness, kisses, or quiet time.","Offer a five-minute shoulder or back massage, if they'd like one.","Take turns saying one thing you want the other to know about your desires.","Choose a song and share one last slow dance.","Ask your partner whether they'd prefer to lead or be led in a romantic moment.","Give each other a long kiss if you're both in the mood.","Share one boundary that helps you feel free to relax and enjoy intimacy.","Put the phones aside and spend two minutes holding each other.","Ask your partner what would make the rest of the evening unforgettable.","End the game together: cuddle, kiss, talk, or enjoy private time however you both choose."]];

function spinPanel(){return '<div class="card"><div class="round">Spin the Chemistry</div><p>Draw an affectionate action and a numbered zone, or land on a mystery wildcard.</p><div id="spin-result" class="challenge" style="font-size:28px;margin:18px 0">Ready to spin?</div><button id="spin-button">Spin</button><button id="spin-pass" class="secondary">Pass / Clear</button><p class="tiny">Zones: 1 Face · 2 Neck · 3 Chest · 4 Stomach · 5 Below Waist. Either person can decline.</p></div>'}
function wireSpin(){document.getElementById('spin-button')?.addEventListener('click',spinChemistry);document.getElementById('spin-pass')?.addEventListener('click',()=>{const e=document.getElementById('spin-result');if(e)e.textContent='Passed — spin when you’re ready.'})}
const LABELS=["The Spark","Get Closer","Turn Up the Heat","After Dark"];const app=document.getElementById('app'),notice=document.getElementById('notice');let channel=null,me=null,room=null,host=false,connected=false,other=false,step=0,deck=[],ack=false,otherAck=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function randomCode(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function makeDeck(){return BANK.flatMap((a,i)=>shuffle(a).slice(0,5).map(t=>({round:i,text:t})))}
function send(type,payload={}){return channel?.send({type:'broadcast',event:'game',payload:{type,from:me,...payload}})}

function setup(){app.innerHTML='<div class="card"><h2>Our private room</h2><p>Start a new evening or join your partner with the private invitation link.</p><div class="controls"><button id="tra">I’m Tra · Create Room</button><button id="iesha">I’m Iesha · Create Room</button></div><p class="tiny">Already have a link? Open it on your own phone.</p></div>';document.getElementById('tra').onclick=()=>create('Tra');document.getElementById('iesha').onclick=()=>create('Iesha')}
function connect(code){room=code;const url=new URL(location.href);url.searchParams.set('room',code);history.replaceState(null,'',url);channel=db.channel('afterhours-'+code,{config:{broadcast:{self:false,ack:true}}});channel.on('broadcast',{event:'game'},({payload:p})=>{if(p.from===me)return;if(p.type==='hello'){other=true;send('hello-back');if(host)send('sync',{deck,step});render()}if(p.type==='hello-back'){other=true;if(host)send('sync',{deck,step});render()}if(p.type==='sync'&&!host){deck=p.deck;step=p.step;other=true;ack=false;otherAck=false;render()}if(p.type==='ready'){otherAck=true;render()}if(p.type==='next'){step=p.step;ack=false;otherAck=false;render()}if(p.type==='reset'&&!host){deck=[];step=0;render()}}).subscribe(status=>{if(status==='SUBSCRIBED'){connected=true;send('hello');render();setNotice('Connected to your private room')}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){setNotice('Connection interrupted. Refresh to reconnect.')}})}
function create(name){me=name;host=true;deck=makeDeck();step=0;connect(randomCode())}

function render(){if(!connected)return;const link=location.href;if(!deck.length){app.innerHTML='<div class="card"><p>Waiting for your partner to start the evening…</p></div>';return}if(step>=deck.length){app.innerHTML='<div class="card"><div class="round">The evening is yours</div><h2>Phones down. Hearts open. ❤️</h2><p>Keep enjoying your time together, however you both choose.</p>'+(host?'<button id="again">Play Again</button>':'')+'</div>';document.getElementById('again')?.addEventListener('click',()=>{deck=makeDeck();step=0;ack=false;otherAck=false;send('sync',{deck,step});render()});return}

const code=new URLSearchParams(location.search).get('room');if(code&&/^[a-f0-9]{36}$/.test(code)){app.innerHTML='<div class="card"><h2>Join your partner</h2><p>Who is playing on this phone?</p><button id="join-tra">Tra</button><button id="join-iesha">Iesha</button></div>';document.getElementById('join-tra').onclick=()=>join('Tra',code);document.getElementById('join-iesha').onclick=()=>join('Iesha',code)}else setup();
</script></body></html>
