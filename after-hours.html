const LABELS=["Temptation","Physical Chemistry","No More Shyness","After Dark"];const app=document.getElementById('app'),notice=document.getElementById('notice');let channel=null,me=null,room=null,host=false,connected=false,other=false,step=0,deck=[],ack=false,otherAck=false;
