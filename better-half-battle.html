<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Better Half Battle · Couples Game Night</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;background:#f4f1eb;color:#1b1712}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:28px 18px 80px;text-align:center}h1{font-size:clamp(38px,6vw,72px);letter-spacing:-.055em;margin:14px 0 8px}h2{letter-spacing:-.04em}p{color:#70685f;line-height:1.5}.tag{font-size:12px;letter-spacing:.15em;font-weight:900;color:#72695e}.panel{background:white;border:1px solid #ded7ce;border-radius:22px;padding:clamp(20px,4vw,34px);margin:20px auto;max-width:850px;box-shadow:0 14px 40px #241c1210}.buttons{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}button,input,select{font:inherit;border-radius:12px;border:1px solid #d9d1c8;padding:14px}button{background:#1c302a;color:white;font-weight:850;cursor:pointer;min-height:50px}button:disabled{opacity:.45;cursor:default}button.alt{background:#fff;color:#1c302a}input,select{background:#fff;width:100%;margin:7px 0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}.choices button{background:#f4f1eb;color:#211c17;min-height:86px;text-align:left;font-size:clamp(16px,2vw,21px)}.choices button.selected{background:#d7e8df;border:2px solid #2d6851}.choices button:disabled{opacity:.85}.score{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid #eae5df;text-align:left}.score:last-child{border:0}.muted{color:#716b63}.code{font-size:clamp(40px,8vw,78px);font-weight:900;letter-spacing:.13em}.pill{background:#eae5dc;padding:9px 15px;border-radius:100px;display:inline-block;font-size:13px;font-weight:850}.notice{color:#9e3d32;font-weight:800}.round{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#776f64}.question{font-size:clamp(25px,4vw,42px);font-weight:850;letter-spacing:-.035em}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,1fr);gap:16px;align-items:start}.layout .panel{margin:0;max-width:none}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{padding:16px;background:#f6f2ec;border-radius:14px;text-align:left}.match{background:#e0f1e6}.miss{background:#fae8e3}.small{font-size:13px}.footer{margin-top:26px}@media(max-width:750px){.layout{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.choices button{min-height:66px}.answers{grid-template-columns:1fr}}@media(min-width:900px){body:has(.layout) main{max-width:1500px}.layout .question{font-size:clamp(32px,3.5vw,55px)}} </style></head><body><main><a href="/couples-games.html" style="color:#526357;font-weight:850;text-decoration:none">← All Game Night Games</a><div class="tag" style="margin-top:26px">COUPLES GAME NIGHT</div><h1>Better Half Battle</h1><p>How well do you really know your spouse?</p><div id="error" class="notice" role="alert"></div><div id="root"></div></main><script>
const Q=[["What's your spouse's ideal date night?",["Dinner out","Movie at home","Weekend getaway","Fun activity"]],["What would your spouse choose for breakfast?",["Pancakes","Eggs and bacon","Cereal","Skip breakfast"]],["Where would your spouse most want to vacation?",["Beach","Mountains","Big city","Cruise"]],["What's your spouse's favorite way to relax?",["Sleep","Watch TV","Read or listen to music","Go outside"]],["What annoys your spouse most at home?",["Dirty dishes","Clothes on floor","Loud noises","Being late"]],["What would your spouse buy with a surprise $1,000?",["Clothes","Technology","Trip","Save it"]],["Which food would your spouse pick?",["Pizza","Tacos","Seafood","Barbecue"]],["What is your spouse most likely to forget?",["Keys","Phone","Appointments","Where they parked"]],["Which household chore does your spouse dislike most?",["Laundry","Dishes","Vacuuming","Bathrooms"]],["What does your spouse do first after work?",["Change clothes","Check phone","Eat","Rest"]],["What is your spouse's love language?",["Words of affirmation","Quality time","Acts of service","Physical touch"]],["What is your spouse most competitive about?",["Sports","Board games","Trivia","Everything"]],["Which gift would your spouse appreciate most?",["Jewelry or watch","An experience","Something practical","A heartfelt letter"]],["What is your spouse's dream weekend?",["Staycation","Road trip","Adventure","Visit family"]],["Which is your spouse's biggest pet peeve?",["Interruptions","Messiness","Slow drivers","Unanswered texts"]],["Which dessert would your spouse pick?",["Cake","Ice cream","Cookies","Pie"]],["What would your spouse rather watch?",["Comedy","Action","Drama","Documentary"]],["How would your spouse spend a free afternoon?",["Shopping","Napping","Hobby","With friends"]],["What would your spouse say is their best quality?",["Sense of humor","Kindness","Determination","Patience"]],["Which would your spouse choose for a dream home?",["Big kitchen","Big backyard","Home theater","Walk-in closet"]]];
const PROMPTS=[["What's your ideal date night?","What's NAME's ideal date night?"],["What would you choose for breakfast?","What would NAME choose for breakfast?"],["Where would you most want to vacation?","Where would NAME most want to vacation?"],["What's your favorite way to relax?","What's NAME's favorite way to relax?"],["What annoys you most at home?","What annoys NAME most at home?"],["What would you buy with a surprise $1,000?","What would NAME buy with a surprise $1,000?"],["Which food would you pick?","Which food would NAME pick?"],["What are you most likely to forget?","What is NAME most likely to forget?"],["Which household chore do you dislike most?","Which household chore does NAME dislike most?"],["What do you do first after work?","What does NAME do first after work?"],["What's your love language?","What's NAME's love language?"],["What are you most competitive about?","What is NAME most competitive about?"],["Which gift would you appreciate most?","Which gift would NAME appreciate most?"],["What's your dream weekend?","What's NAME's dream weekend?"],["What's your biggest pet peeve?","What's NAME's biggest pet peeve?"],["Which dessert would you pick?","Which dessert would NAME pick?"],["What would you rather watch?","What would NAME rather watch?"],["How would you spend a free afternoon?","How would NAME spend a free afternoon?"],["What would you say is your best quality?","What would NAME say is their best quality?"],["Which feature would you choose for a dream home?","Which feature would NAME choose for a dream home?"]];const FIRST_NAMES=[['Tra','Iesha'],['Colby','Kheiston'],['Darius','Paesha']];function questionText(idx,couple,side,roundIdx=idx){const target=roundIdx%2===0?'wife':'husband';return PROMPTS[idx][side===target?0:1].replace('NAME',FIRST_NAMES[couple-1][target==='wife'?1:0])}
const EXTRA=[["What's your favorite way to spend a Saturday?",["Sleeping in","Going out","Family time","Getting things done"]],["What would you order on a coffee run?",["Coffee","Tea","Smoothie","Nothing"]],["What is your ideal birthday celebration?",["Big party","Quiet dinner","Travel","Stay home"]],["Which would you pick for a weekend trip?",["Cabin","Beach house","City hotel","Camping"]],["What's your go-to comfort food?",["Chicken","Soup","Pizza","Sweets"]],["What's your biggest spending temptation?",["Food","Clothes","Gadgets","Travel"]],["Which activity sounds most fun?",["Bowling","Concert","Hiking","Escape room"]],["What's your preferred bedtime?",["Before 9","9–10 PM","10–11 PM","After 11"]],["What do you value most in a vacation?",["Rest","Adventure","Good food","Sightseeing"]],["What would you choose for a movie snack?",["Popcorn","Candy","Nachos","Nothing"]],["What's your favorite kind of weather?",["Sunny","Rainy","Cold","Warm and cloudy"]],["What makes you feel most appreciated?",["Compliments","Help with tasks","Quality time","Thoughtful gifts"]],["Which kind of music would you play in the car?",["Gospel","R&B","Hip-hop","Country"]],["What would you rather do on a day off?",["Go shopping","Stay home","Visit friends","Try something new"]],["What is your favorite way to celebrate an anniversary?",["Fancy dinner","Weekend trip","Thoughtful gift","Quiet night in"]],["What is your first choice for a pet?",["Dog","Cat","Fish","No pets"]],["What would you rather learn?",["New language","Instrument","Cooking","New sport"]],["What is your biggest morning struggle?",["Waking up","Finding clothes","Getting ready","Skipping breakfast"]],["What's your favorite type of restaurant?",["Steakhouse","Mexican","Seafood","Italian"]],["Which would you rather receive?",["Surprise flowers","A handwritten note","Tickets to an event","A shopping gift card"]]];
const LIKELY=["Who is more likely to forget an anniversary?","Who is more likely to fall asleep during a movie?","Who is more likely to get lost while driving?","Who is more likely to spend too much while shopping?","Who is more likely to start dancing in public?","Who is more likely to apologize first after an argument?","Who is more likely to plan a surprise date?","Who is more likely to be late to an event?","Who is more likely to cry during a movie?","Who is more likely to eat the last slice of pizza?","Who is more likely to win a trivia game?","Who is more likely to take the longest getting ready?","Who is more likely to talk to strangers?","Who is more likely to leave their phone somewhere?","Who is more likely to organize a family trip?","Who is more likely to laugh at the wrong moment?","Who is more likely to sing loudly in the car?","Who is more likely to remember every detail of a conversation?","Who is more likely to buy something they don't need?","Who is more likely to suggest a spontaneous adventure?","Who is more likely to win an argument?","Who is more likely to take the most photos?","Who is more likely to stay up all night?","Who is more likely to make friends at a party?"];
function deck(code){let seed=2166136261;for(const c of code)seed=Math.imul(seed^c.charCodeAt(0),16777619)>>>0;const rand=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296};const standard=[...Q.map((_,i)=>({kind:'classic',id:i})),...EXTRA.map((_,i)=>({kind:'extra',id:i}))];const social=LIKELY.map((_,i)=>({kind:'likely',id:i}));function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}return shuffle([...shuffle(standard).slice(0,12),...shuffle(social).slice(0,8)])}
function roundQuestion(idx){const d=deck(me.code)[idx];if(d.kind==='likely')return {kind:'likely',text:LIKELY[d.id],options:null};if(d.kind==='classic')return {kind:'classic',text:PROMPTS[d.id],options:Q[d.id][1]};return {kind:'extra',text:EXTRA[d.id][0],options:EXTRA[d.id][1]}}
function roundOptions(idx,couple){const q=roundQuestion(idx);return q.kind==='likely'?[FIRST_NAMES[couple-1][0],FIRST_NAMES[couple-1][1],'Both']:q.options}
function roundText(idx,couple,side){const q=roundQuestion(idx);if(q.kind==='likely')return q.text;if(q.kind==='extra'){const target=idx%2===0?'wife':'husband',person=FIRST_NAMES[couple-1][target==='wife'?1:0];return side===target?q.text:q.text.replace(/your/gi,person+"'s").replace(/you\b/gi,person)}return questionText(q.kind==='classic'?deck(me.code)[idx].id:idx,couple,side,idx)}
const db=supabase.createClient('https://jjzjqjvdnaeuftptvmyw.supabase.co','sb_publishable_QPQY6u-wJBKULuaEgsG4lA_KiWCwhN4');
const MEMBERS=['Tra & Iesha','Colby & Kheiston','Darius & Paesha'];
const displayName=(name)=>{const i=NAMES.indexOf(name);return esc(name)+(i<0?'':'<span style="display:block;font-size:12px;color:#716b63;font-weight:500;margin-top:3px">'+esc(MEMBERS[i])+'</span>')};
const root=document.getElementById('root'),error=document.getElementById('error'),NAMES=['The Whites','The Boones','The Prelows'];let me=JSON.parse(sessionStorage.getItem('bhbIdentity')||'null'),state=null,working=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COUPLES=['Tra & Iesha','Colby & Kheiston','Darius & Paesha'];const label=p=>NAMES[p.couple-1]+' · '+(p.side==='husband'?'Husband':'Wife');const named=n=>'<div><strong>'+esc(NAMES[n-1])+'</strong><div class="muted small">'+esc(COUPLES[n-1])+'</div></div>';
async function rpc(name,args){const {data,error:e}=await db.rpc('bhb_'+name,args||{});if(e)throw Error(e.message);return data}
function save(x){me=x;sessionStorage.setItem('bhbIdentity',JSON.stringify(x))}
function msg(x){error.textContent=x||''}
async function act(name,args){if(working)return;working=true;msg('');try{await rpc(name,args);await refresh()}catch(e){msg(e.message)}finally{working=false}}
async function create(){try{const d=await rpc('create');save({...d,host:true});await refresh()}catch(e){msg(e.message)}}
async function join(){const code=document.getElementById('code').value.trim().toUpperCase(),couple=Number(document.getElementById('couple').value),side=document.getElementById('side').value;try{const d=await rpc('join',{p_code:code,p_couple:couple,p_side:side});save({...d,host:false});await refresh()}catch(e){msg(e.message)}}
function joinView(){const code=new URLSearchParams(location.search).get('room')||'';root.innerHTML='<div class="panel"><h2>Join the battle</h2><p>Each spouse uses their own phone. Keep your answers secret!</p><input id="code" placeholder="6-character room code" maxlength="6" value="'+esc(code)+'"><select id="couple"><option value="1">The Whites — Tra &amp; Iesha</option><option value="2">The Boones — Colby &amp; Kheiston</option><option value="3">The Prelows — Darius &amp; Paesha</option></select><select id="side"><option value="husband">Husband</option><option value="wife">Wife</option></select><div class="buttons"><button onclick="join()">Join Game</button><button class="alt" onclick="me=null;create()">Host on TV</button></div></div>'}
function home(){root.innerHTML='<div class="panel"><h2>Ready to find out who knows whom?</h2><p>One host screen on the TV, six separate phones, and twenty rounds of private answers.</p><div class="buttons"><button onclick="create()">Host a Game</button><button class="alt" onclick="joinView()">Join on Phone</button></div></div>'}
function allAnswers(idx){return (state.answers||[]).filter(a=>a.idx===idx)}
function choice(p,idx){return allAnswers(idx).find(a=>a.player===p?.id)?.choice}
function couplePlayers(n){return (state.players||[]).filter(p=>p.couple===n)}
function scores(){return NAMES.map((name,i)=>{let pts=0;for(let n=0;n<Math.min(state.idx+(state.reveal?1:0),20);n++){const ps=couplePlayers(i+1);if(ps.length===2){const a=choice(ps[0],n),b=choice(ps[1],n);if(a!==undefined&&b!==undefined&&a===b)pts+=n>=15?200:100}}return {name,pts}}).sort((a,b)=>b.pts-a.pts)}
function board(){return '<div class="panel"><h2>Live Leaderboard</h2>'+scores().map((s,i)=>'<div class="score"><strong>'+(i+1)+'. '+displayName(s.name)+'</strong><strong>'+s.pts+' pts</strong></div>').join('')+'</div>'}
function status(){return '<div class="panel"><h2>Players Joined · '+state.players.length+'/6</h2>'+[1,2,3].map(n=>'<div class="score"><strong>'+displayName(NAMES[n-1])+'</strong><span>'+['husband','wife'].map(side=>state.players.some(p=>p.couple===n&&p.side===side)?(side==='husband'?'Husband ✓':'Wife ✓'):(side==='husband'?'Husband —':'Wife —')).join(' · ')+'</span></div>').join('')+'</div>'}
function reveal(){const idx=state.idx,question=roundQuestion(idx),ps=state.players;return '<div class="panel"><div class="round">Round '+(idx+1)+' Results</div><h2>'+esc(question.kind==='likely'?question.text:(idx%2===0?'Know Your Wife':'Know Your Husband'))+'</h2>'+NAMES.map((name,i)=>{const pair=ps.filter(p=>p.couple===i+1),h=pair.find(p=>p.side==='husband'),w=pair.find(p=>p.side==='wife'),hc=choice(h,idx),wc=choice(w,idx),match=hc!==undefined&&wc!==undefined&&hc===wc;return '<div class="answer '+(match?'match':'miss')+'" style="margin:12px 0"><strong>'+displayName(name)+' · '+(match?'MATCH! +'+(idx>=15?200:100):'No match')+'</strong><div class="answers" style="margin-top:12px"><div>'+(question.kind==='likely'?'Husband chose':idx%2===0?'Husband guessed':'Husband answered')+': <strong>'+esc(hc===undefined?'No answer':roundOptions(idx,i+1)[hc])+'</strong></div><div>'+(question.kind==='likely'?'Wife chose':idx%2===0?'Wife answered':'Wife guessed')+': <strong>'+esc(wc===undefined?'No answer':roundOptions(idx,i+1)[wc])+'</strong></div></div></div>'}).join('')+'</div>'}
function render(){if(!state){home();return}const host=me.host;const url=location.origin+'/better-half-battle.html?room='+encodeURIComponent(me.code);let content='';
if(state.stage==='lobby'){content='<div class="panel"><div class="round">Room code</div><div class="code">'+esc(me.code)+'</div>'+(host?'<p>Scan to join on your own phone</p><img alt="Join QR code" width="205" height="205" src="https://api.qrserver.com/v1/create-qr-code/?size=205x205&data='+encodeURIComponent(url)+'"><p class="small">'+esc(url)+'</p>':'<p>Waiting for the host to begin...</p>')+'</div>'+status()+(host?'<div class="buttons"><button onclick="hostAction(\'start\')" '+(state.players.length===6?'':'disabled')+'>Start Full Game</button><button class="alt" onclick="hostAction(\'test\')">Test Game Without Players</button></div><p class="small muted">Test mode lets you preview every question, reveal answers, and advance rounds without waiting for six phones. Create a new room for the real game.</p>':'')}
else if(state.stage==='finished'){content='<div class="panel"><div class="round">Final Results</div><h2>Better Half Battle Champions 🏆</h2><div class="question">'+esc(scores()[0].name)+'</div></div>'+board()+(host?'<p>Game complete! Return to the game library to choose another game.</p>':'')}
else {const q=roundQuestion(state.idx),mine=state.me,own=mine&&choice(mine,state.idx),count=allAnswers(state.idx).length,target=state.idx%2===0?'wife':'husband',opts=roundOptions(state.idx,mine?.couple||1);let center='';
if(state.reveal){center=reveal()+(host?'<div class="buttons"><button onclick="hostAction(\'next\')">'+(state.idx===19?'Show Final Scores':'Next Question →')+'</button></div>':'<p>Waiting for the host to continue...</p>')}
else {center='<div class="panel"><div class="round">Round '+(state.idx+1)+' of 20 · '+(q.kind==='likely'?'WHO IS MORE LIKELY?':target==='wife'?'KNOW YOUR WIFE':'KNOW YOUR HUSBAND')+' · '+(state.idx>=15?'DOUBLE POINTS':'100 POINTS PER MATCH')+'</div><div class="question">'+esc(host?(q.kind==='likely'?q.text:q.kind==='extra'?q.text:q.text[1].replace('NAME',target==='wife'?'your wife':'your husband')):roundText(state.idx,mine.couple,mine.side))+'</div><p>'+(host?q.kind==='likely'?'Both spouses choose independently: husband, wife, or both.':('This round, '+(target==='wife'?'wives':'husbands')+' answer for themselves. Their spouses guess. Answers stay hidden until reveal.'):(q.kind==='likely'?'Choose who is more likely. Matching answers earn points.':(mine.side===target?'Answer for YOURSELF. Your spouse is guessing your answer.':'GUESS what your spouse would choose. Your spouse is answering for themselves.')))+'</p>'+(host?'<div class="choices">'+opts.map((x,i)=>'<button disabled>'+(i+1)+'. '+esc(x)+'</button>').join('')+'</div><p>'+count+' of 6 answers submitted</p><button onclick="hostAction(\'reveal\')">Reveal Answers</button>':'<div class="choices">'+opts.map((x,i)=>'<button class="'+(own===i?'selected':'')+'" '+(own!==undefined?'disabled':'')+' onclick="submit('+i+')">'+esc(x)+'</button>').join('')+'</div>'+(own!==undefined?'<p class="pill">Answer locked in ✓</p>':'<p class="muted">Your choice stays private until the reveal.</p>'))+'</div>'}
content=host?'<div class="layout"><section>'+center+'</section><aside>'+board()+'</aside></div>':center+(state.reveal?board():'')}
root.innerHTML=content}
async function refresh(){if(!me)return;try{state=await rpc('state',{p_code:me.code,p_token:me.token});msg('');render()}catch(e){msg(e.message);if(/Room not found|Access denied|authorization/i.test(e.message)){me=null;sessionStorage.removeItem('bhbIdentity');state=null;home()}}}
function hostAction(a){act('host',{p_code:me.code,p_token:me.token,p_action:a})}
function submit(i){act('submit',{p_code:me.code,p_token:me.token,p_choice:i})}
if(me)refresh();else if(new URLSearchParams(location.search).has('room'))joinView();else home();
setInterval(()=>{if(me&&!working)refresh()},1700);
</script></body></html>
