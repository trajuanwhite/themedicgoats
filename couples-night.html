<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Battle • Couples Game Night</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17130f;background:#f4f1eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f4f1eb;color:#17130f}
main{max-width:1000px;margin:0 auto;padding:52px 20px 90px;text-align:center}
h1,h2{letter-spacing:-.045em;line-height:1.08}
h1{font-size:clamp(42px,7vw,76px);font-weight:900;margin:12px 0 16px;color:#17130f}
h2{font-size:clamp(25px,4vw,39px);font-weight:850;margin:8px 0 24px}
p{line-height:1.55;color:#6d675f}
.tag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#716b63;background:#eae4db;border:1px solid #ddd6cc;padding:9px 14px;border-radius:999px}
.panel{background:#fff;color:#17130f;border:1px solid #ddd6cc;border-radius:24px;padding:clamp(20px,4vw,38px);margin:22px auto;max-width:760px;box-shadow:0 12px 36px #241c1210}
.panel h2{color:#17130f}
button,input,select{font:inherit;border-radius:13px;padding:14px;border:1px solid #ddd6cc}
input,select{width:100%;margin:7px 0;background:#fff;color:#17130f}
input:focus,select:focus,button:focus-visible{outline:3px solid #a8b7a9;outline-offset:2px}
button{cursor:pointer;background:#17130f;color:#fff;font-weight:800;border:1px solid #17130f;margin:6px;min-height:48px;transition:transform .15s ease,background .15s ease}
button:hover:not(:disabled){transform:translateY(-1px);background:#36302a}
button:disabled{opacity:.52;cursor:default}
.secondary{background:#fff;color:#17130f;border-color:#d9d2c9}
.secondary:hover:not(:disabled){background:#f1ece5}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.choices button{min-height:94px;text-align:left;font-size:clamp(16px,2vw,21px);background:#f7f4ef;color:#17130f;border:1px solid #ddd6cc;margin:0;padding:20px}
.choices button:hover:not(:disabled){background:#eae4db}
.choices button.picked{background:#e6e1d3;border:2px solid #615947}
.choices button.correct{background:#e5f3e9;border:2px solid #237445;color:#15542f}
.choices button.wrong{background:#fbe8e5;border:2px solid #b53f34;color:#81291f}
.score{display:flex;justify-content:space-between;align-items:center;padding:16px 8px;border-bottom:1px solid #e9e3db;gap:12px;text-align:left}
.score:last-child{border-bottom:0}
.muted{opacity:.7}
.big{font-size:64px;font-weight:900;color:#17130f}
.code{font-size:clamp(40px,8vw,84px);letter-spacing:.15em;font-weight:900;color:#17130f}
.host-controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.notice{color:#9c352e;font-weight:700}
.round{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6d675f;font-weight:900;margin-bottom:16px}
.mini{font-size:14px}
.hide{display:none}
@media(max-width:550px){main{padding:30px 14px 70px}.choices{grid-template-columns:1fr;gap:9px}.panel{padding:20px}.choices button{min-height:68px;padding:15px}.score{font-size:14px}}

/* TV host view: Kahoot-inspired split layout, without changing phone play */
@media(min-width:900px){body:has(.tv-layout) main{max-width:1600px;padding:26px 32px 55px}body:has(.tv-layout) main>h1{font-size:clamp(38px,4vw,56px);margin:4px 0 8px}body:has(.tv-layout) main>p{margin:4px 0 12px}body:has(.tv-layout) .tv-layout{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(280px,.85fr);align-items:start;gap:20px;text-align:left}body:has(.tv-layout) .tv-layout>.tv-question .panel{max-width:none;margin:0;min-height:420px}body:has(.tv-layout) .tv-layout>.tv-scores .panel{max-width:none;margin:0;position:sticky;top:18px;padding:24px}body:has(.tv-layout) .tv-question h2{font-size:clamp(28px,3vw,45px)}body:has(.tv-layout) .tv-question .choices button{min-height:112px;font-size:clamp(18px,1.65vw,26px)}body:has(.tv-layout) .tv-scores .score{padding:20px 4px;font-size:clamp(16px,1.3vw,22px)}body:has(.tv-layout) .tv-scores .score strong:last-child{white-space:nowrap}body:has(.tv-layout) .tv-scores h2{font-size:27px;margin-bottom:18px}body:has(.tv-layout) .tv-question .host-controls{justify-content:flex-start;margin:16px 0}}
@media(min-width:650px) and (max-width:899px){body:has(.tv-layout) main{max-width:100%;padding:24px}body:has(.tv-layout) .tv-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,.85fr);gap:12px;align-items:start}body:has(.tv-layout) .tv-layout .panel{margin:0;max-width:none;padding:18px}body:has(.tv-layout) .tv-scores .score{font-size:14px}}
.question-timer{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f4f1eb;border:1px solid #ddd6cc;border-radius:14px;padding:13px 18px;margin:12px 0 24px;font-weight:900}.question-timer .timer-value{font-size:clamp(30px,4vw,48px);font-variant-numeric:tabular-nums}.question-timer.urgent{background:#fbe8e5;border-color:#b53f34;color:#a02e27}.timer-track{height:9px;background:#e7dfd4;border-radius:20px;overflow:hidden;margin:-14px 0 24px}.timer-fill{height:100%;width:100%;background:#397a64;transition:width .4s linear}.timer-fill.urgent{background:#b53f34}@media(min-width:900px){body:has(.tv-layout) .question-timer .timer-value{font-size:60px}}
</style></head><body><main><a href="/couples-games.html" style="display:inline-block;margin:0 0 20px;color:#5d625a;font-weight:800;text-decoration:none;border:1px solid #ddd6cc;background:#fff;border-radius:100px;padding:10px 16px">← All Game Night Games</a><div class="tag">Faith • Love • Laughter</div><h1>✦ Bible Battle ✦</h1><p>COUPLES GAME NIGHT · 3 COUPLES · 2 BATTLE MODES</p><div id="root"><div class="panel"><h2>Welcome to Game Night</h2><button id="create">Host a Game</button><button id="join">Join from Your Phone</button></div></div><p id="error" class="notice" role="alert"></p></main><script>
const QUESTIONS=[["Who built the ark?",["Moses","Noah","Abraham","David"],1,"Genesis 6"],["What was Jesus' first recorded miracle?",["Walking on water","Healing a blind man","Turning water into wine","Feeding 5,000"],2,"John 2:1–11"],["Who was swallowed by a great fish?",["Jonah","Elijah","Peter","Paul"],0,"Jonah 1:17"],["How many disciples did Jesus choose as apostles?",["7","10","12","14"],2,"Luke 6:13"],["Who defeated Goliath?",["Solomon","David","Samson","Joshua"],1,"1 Samuel 17"],["Who was Ruth's mother-in-law?",["Sarah","Esther","Naomi","Miriam"],2,"Ruth 1"],["Which couple was visited by angels before Sodom was destroyed?",["Isaac and Rebekah","Lot and his wife","Abraham and Sarah","Jacob and Rachel"],2,"Genesis 18"],["Who interpreted Pharaoh's dreams in Egypt?",["Daniel","Joseph","Moses","Aaron"],1,"Genesis 41"],["Who was the first king of Israel?",["David","Saul","Solomon","Samuel"],1,"1 Samuel 10"],["Who was the husband of Priscilla?",["Aquila","Apollos","Silas","Barnabas"],0,"Acts 18:2"],["Which woman became queen and helped save her people?",["Deborah","Esther","Hannah","Abigail"],1,"Esther 4–8"],["Who was instructed to marry Gomer?",["Isaiah","Hosea","Jeremiah","Ezekiel"],1,"Hosea 1:2–3"],["Who was the father of John the Baptist?",["Joseph","Zechariah","Simeon","Nicodemus"],1,"Luke 1"],["Which judge made a vow concerning whoever came out of his house?",["Gideon","Samson","Jephthah","Ehud"],2,"Judges 11"],["What were the names of the couple who lied about proceeds from land?",["Aquila and Priscilla","Ananias and Sapphira","Abraham and Sarah","Isaac and Rebekah"],1,"Acts 5"],["Who was Paul's companion imprisoned with him at Philippi?",["Barnabas","Timothy","Silas","Titus"],2,"Acts 16:25"],["Which prophet confronted David about Bathsheba?",["Samuel","Nathan","Elijah","Gad"],1,"2 Samuel 12"],["Who was the mother of Samuel?",["Hannah","Rachel","Leah","Elizabeth"],0,"1 Samuel 1"],["In Revelation, which church was called lukewarm?",["Ephesus","Smyrna","Philadelphia","Laodicea"],3,"Revelation 3:14–16"],["Who said, 'As for me and my house, we will serve the LORD'?",["Moses","Joshua","David","Nehemiah"],1,"Joshua 24:15"]];
const db=supabase.createClient('https://jjzjqjvdnaeuftptvmyw.supabase.co','sb_publishable_QPQY6u-wJBKULuaEgsG4lA_KiWCwhN4');
const root=document.getElementById('root'),error=document.getElementById('error');let state=null,identity=JSON.parse(sessionStorage.getItem('bibleIdentity')||'null'),timer=null,busy=false;
function secondsLeft(){if(!state?.startedAt)return 60;const t=Date.parse(state.startedAt);return Number.isFinite(t)?Math.max(0,Math.ceil(60-(Date.now()-t)/1000)):60}
function paintTimer(){const n=secondsLeft(),el=document.getElementById('question-timer');if(!el)return;el.classList.toggle('urgent',n<=10);const val=el.querySelector('.timer-value');if(val)val.textContent='0:'+String(n).padStart(2,'0');const fill=document.getElementById('timer-fill');if(fill){fill.style.width=(n/60*100)+'%';fill.classList.toggle('urgent',n<=10)}if(n===0){document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true)}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,payload={}){const {data,error:e}=await db.rpc('couples_bible_action',{action,payload});if(e)throw Error(e.message);if(data?.error)throw Error(data.error);return data}
function fail(e){error.textContent=e.message||String(e);setTimeout(()=>error.textContent='',6000)}
function save(){sessionStorage.setItem('bibleIdentity',JSON.stringify(identity))}
function screen(s){root.innerHTML=s}
function intro(){screen('<div class="panel"><h2>Welcome to Game Night</h2><button id="create">Host a Game</button><button id="join">Join from Your Phone</button></div>');document.getElementById('create').onclick=create;document.getElementById('join').onclick=joinForm}
async function create(){try{const x=await api('create');identity={host:true,room:x.room,code:x.code,hostKey:x.hostKey};save();history.replaceState({},'',location.pathname+'?room='+x.code);await refresh()}catch(e){fail(e)}}
function joinForm(){const code=new URLSearchParams(location.search).get('room')||'';screen('<div class="panel"><h2>Join Bible Battle</h2><input id="code" placeholder="6-character room code" maxlength="6" value="'+esc(code)+'"><div id="team-pick"><p>Loading team options…</p></div><button id="go">Join Game</button></div>');let room=null;const codeInput=document.getElementById('code');async function loadMode(){try{const x=await api('state',{code:codeInput.value.trim().toUpperCase()});room=x;const names=x.mode==='couples'?['The Whites','The Boones','The Prelows']:['Men','Women'];const used=new Set((x.players||[]).map(p=>x.mode==='couples'?String(p.couple):p.side));document.getElementById('team-pick').innerHTML='<p>One phone per '+(x.mode==='couples'?'couple':'team')+'. Discuss and submit one answer together.</p><select id="team">'+names.map((name,i)=>{const val=x.mode==='couples'?String(i+1):name.toLowerCase();return '<option value="'+val+'" '+(used.has(val)?'disabled':'')+'>'+esc(name)+(x.mode==='couples'?' ('+esc(COUPLE_MEMBERS[i])+')':'')+(used.has(val)?' — Joined':'')+'</option>'}).join('')+'</select>'; }catch(e){document.getElementById('team-pick').innerHTML='<p>Enter a valid room code to choose your team.</p>'}}codeInput.addEventListener('change',loadMode);if(codeInput.value)loadMode();document.getElementById('go').onclick=async()=>{try{const code=codeInput.value.trim().toUpperCase();if(!room||room.code!==code)room=await api('state',{code});const team=document.getElementById('team')?.value;if(!team)throw Error('Choose an available team');const couples=room.mode==='couples',couple=couples?+team:0,side=couples?'couple':team,name=couples?['The Whites','The Boones','The Prelows'][couple-1]:team==='men'?'Men':'Women';const p=await api('join',{room:room.room,name,couple,side});identity={room:room.room,code,player:p.player,playerKey:p.playerKey,name};save();history.replaceState({},'',location.pathname+'?room='+code);await refresh()}catch(e){fail(e)}}}
function points(){const players=state.players||[],answers=state.answers||[];return players.map(p=>({...p,score:(state.verseAwards||[]).filter(a=>a.player===p.id).reduce((n,a)=>n+a.points,0)+answers.filter(a=>a.player===p.id&&(a.index<state.index||state.reveal&&a.index===state.index||state.stage==='finished')).reduce((n,a)=>n+(a.points||0),0)}))}
const COUPLE_MEMBERS=['Tra & Iesha','Colby & Kheiston','Darius & Paesha'];\nfunction coupleDisplay(name){const i=['The Whites','The Boones','The Prelows'].indexOf(name);return i<0?esc(name):esc(name)+'<span style="display:block;font-size:12px;font-weight:500;color:#716b63;margin-top:3px">'+esc(COUPLE_MEMBERS[i])+'</span>'}\nfunction board(){const ps=points(),names=state.mode==='couples'?['The Whites','The Boones','The Prelows']:['Men','Women'];const values=names.map((name,i)=>({name,score:ps.filter(p=>state.mode==='couples'?p.couple===i+1:p.side===name.toLowerCase()).reduce((n,p)=>n+p.score,0)})).sort((a,b)=>b.score-a.score);return '<div class="panel"><h2>🏆 '+(state.mode==='couples'?'Couples Leaderboard':'Men vs. Women')+'</h2>'+values.map((x,i)=>'<div class="score"><strong>'+(i+1)+'. '+coupleDisplay(x.name)+'</strong><strong>'+x.score+' pts</strong></div>').join('')+'</div>'}
function speedBoard(){const teams=state.mode==='couples'?['The Whites','The Boones','The Prelows']:['Men','Women'];return '<div class="panel"><h2>Answer Speeds</h2>'+teams.map((name,i)=>{const p=state.players.find(x=>state.mode==='couples'?x.couple===i+1:x.side===name.toLowerCase());const a=p&&state.answers.find(x=>x.player===p.id&&x.index===state.index);const t=p&&(state.answerTimes||[]).find(x=>x.player===p.id&&x.index===state.index);return '<div class="score"><strong>'+coupleDisplay(name)+'</strong><span>'+(t?Number(t.seconds).toFixed(1)+'s · '+(a?.points>0?'Correct':'Incorrect'):'No answer')+'</span></div>'}).join('')+'</div>'}
function qr(){const url=location.origin+location.pathname+'?room='+state.code;return '<img width="190" height="190" alt="QR code to join" src="https://api.qrserver.com/v1/create-qr-code/?size=190x190&data='+encodeURIComponent(url)+'"><p class="mini">Or open <strong>'+esc(location.host+location.pathname)+'</strong></p>'}
function teamLabel(v){return v?.startsWith('couple-')?(['The Whites','The Boones','The Prelows'][Number(v.split('-')[1])-1]||v):v==='men'?'Men':'Women'}
function myTurn(){const me=(state.players||[]).find(p=>p.id===identity?.player);return me&&(state.index===0?(state.mode==='couples'?'couple-'+me.couple:me.side)===state.chooser:me.id===state.chooserPlayer)}
function render(){if(!state)return;const host=identity?.host,ps=state.players||[],idx=state.index,q=state.question;let content='';
if(state.stage==='lobby'){content='<div class="panel"><h2>Waiting for Players</h2><div class="code">'+esc(state.code)+'</div>'+qr()+'<p>'+ps.length+' of '+(state.mode==='couples'?3:2)+' team phones joined</p>'+ps.map(p=>'<div class="score"><span>'+coupleDisplay(p.name)+'</span><span>'+(state.mode==='couples'?'Couple '+p.couple+' · ':'')+esc(p.side)+'</span></div>').join('')+(host?'<button id="start">Choose Opening Team & Start</button>':'<p>Waiting for the host to start…</p>')+'</div>'}
else if(state.stage==='finished'){content='<div class="panel"><h2>🎉 Bible Battle Champions</h2><p>20 questions complete!</p></div>'+board()+(host?'<button id="restart">Play Again</button>':'')}
else if(state.stage==='choosing'){const canChoose=!host&&myTurn();content='<div class="panel"><div class="round">Question '+(idx+1)+' of 20</div><h2>📖 '+coupleDisplay(teamLabel(state.chooser))+' chooses the next book!</h2>'+(idx===0?'<p>Randomly selected to open Bible Battle.</p>':'<p>The highest-scoring team on the last question chooses. Ties are decided randomly.</p>')+(canChoose?(!state.testament&&idx===0?'<h2>Choose a Testament</h2><p>The first question will be randomly selected from your chosen Testament.</p><button data-testament="Old Testament">Old Testament</button><button data-testament="New Testament">New Testament</button>':'<p>Pick a specific book for the next question:</p><div class="choices">'+(state.books||[]).map(book=>'<button data-book="'+esc(book)+'">'+esc(book)+'</button>').join('')+'</div>'):'<p>Waiting for '+esc(idx===0?teamLabel(state.chooser):(ps.find(p=>p.id===state.chooserPlayer)?.name||'selected player'))+' to choose on their phone…</p>')+'</div>'+board()}
else if(state.verseActive){content='<div class="panel"><div class="round">⚡ SURPRISE CHALLENGE · FIND THAT VERSE</div><h2>📖 '+esc(state.verseReference)+'</h2><p>Open your physical Bibles! First team to find the verse, read it aloud, and show it to the host wins <strong>1,500 points</strong>.</p><p>Only the first team scores. All other teams receive 0 points.</p>'+(host?'<h3>Who found it first?</h3><div class="choices">'+ps.map(p=>'<button data-verse-winner="'+esc(p.id)+'">'+esc(p.name)+'</button>').join('')+'</div>':'<p>Race to find it! The host will confirm the winning team.</p>')+'</div>'+board()}
else if(state.stage==='playing'&&q){const answered=state.answers.filter(a=>a.index===idx),mine=answered.find(a=>a.player===identity?.player);content='<div class="panel"><div class="round">'+esc(state.book)+' · Round '+(Math.floor(idx/5)+1)+' · Question '+(idx+1)+' of 20'+(idx>=15?' · DOUBLE POINTS':'')+'</div>'+(state.reveal?'':'<div id="question-timer" class="question-timer"><span>⏱ Time to answer</span><span class="timer-value">1:00</span></div><div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>')+'<h2>'+esc(q.text)+'</h2><div class="choices">'+q.choices.map((opt,i)=>'<button data-choice="'+i+'" '+(!host&&(mine||state.reveal)?'disabled':'')+' class="'+(state.reveal?(i===q.correct?'correct':mine?.choice===i?'wrong':''):mine?.choice===i?'picked':'')+'">'+String.fromCharCode(65+i)+'. '+esc(opt)+'</button>').join('')+'</div>'+(state.reveal?'<p><strong>Correct answer:</strong> '+esc(q.choices[q.correct])+'<br><span class="muted">'+esc(q.reference)+'</span></p>':host?'<p>'+answered.length+' / '+ps.length+' answers submitted · Speed scoring active</p>':mine?'<p>✓ Answer locked in! Faster correct answers earn more points.</p>':'<p>Discuss together and submit one answer! Correct answers start at 1,000 points and decrease by 30 per second (minimum 100).</p>')+'</div>'+board()+(state.reveal?speedBoard():'');if(host)content+='<div class="host-controls">'+(!state.reveal?'<button id="reveal">Reveal Answer</button>':'<button id="next">'+(idx===19?'Finish Game':'Award Book Choice →')+'</button>')+'</div>'}
if(host)content='<div class="host-controls">'+(state.stage==='lobby'?'<button id="mode" class="secondary">Mode: '+(state.mode==='couples'?'Couples vs Couples':'Men vs Women')+' ⇄</button>':'<span class="mini">Mode: '+(state.mode==='couples'?'Couples vs Couples':'Men vs Women')+'</span>')+'<span class="mini">Host controls · Display on TV</span></div>'+content;
if(host&&state.stage!=='lobby'){const scoreHtml=board();const speedHtml=state.stage==='playing'&&state.reveal?speedBoard():'';content=content.replace(scoreHtml,'');if(speedHtml)content=content.replace(speedHtml,'');content='<div class="tv-layout"><section class="tv-question">'+content+'</section><aside class="tv-scores">'+scoreHtml+speedHtml+'</aside></div>'}
screen(content);paintTimer();
if(host){document.querySelectorAll('[data-verse-winner]').forEach(el=>el.onclick=()=>control({verseWinner:el.dataset.verseWinner}));document.getElementById('mode')?.addEventListener('click',()=>control({mode:state.mode==='couples'?'menwomen':'couples'}));document.getElementById('start')?.addEventListener('click',()=>control({stage:'choosing'}));document.getElementById('reveal')?.addEventListener('click',()=>control({reveal:true}));document.getElementById('next')?.addEventListener('click',()=>control(idx===19?{stage:'finished'}:{next:true}));document.getElementById('restart')?.addEventListener('click',()=>control({stage:'lobby'}))}
if(!host&&state.stage==='choosing'&&myTurn()){document.querySelectorAll('[data-testament]').forEach(el=>el.onclick=async()=>{try{await api('choose',{room:identity.room,player:identity.player,playerKey:identity.playerKey,testament:el.dataset.testament});await refresh()}catch(e){fail(e)}});document.querySelectorAll('[data-book]').forEach(el=>el.onclick=async()=>{try{await api('choose',{room:identity.room,player:identity.player,playerKey:identity.playerKey,book:el.dataset.book});await refresh()}catch(e){fail(e)}})}
if(!host&&state.stage==='playing'&&!state.reveal&&!state.answers.some(a=>a.player===identity.player&&a.index===idx)){document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=async()=>{if(busy)return;busy=true;try{await api('answer',{room:identity.room,player:identity.player,playerKey:identity.playerKey,index:idx,choice:+el.dataset.choice});await refresh()}catch(e){fail(e)}finally{busy=false}})}
}
async function control(p){try{await api('host',{room:identity.room,hostKey:identity.hostKey,...p});await refresh()}catch(e){fail(e)}}
async function refresh(){if(!identity)return;try{const next=await api('state',{code:identity.code});const changed=JSON.stringify(next)!==JSON.stringify(state);state=next;if(changed)render()}catch(e){fail(e)}}
setInterval(paintTimer,250);
const code=new URLSearchParams(location.search).get('room');if(identity&&(!code||code===identity.code)){refresh();timer=setInterval(refresh,1300)}else{identity=null;intro();if(code)joinForm();timer=setInterval(()=>{if(identity)refresh()},1300)}
</script></body></html>
