<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Battle • Couples Game Night</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17130f;background:#f4f1eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f4f1eb;color:#17130f}
main{max-width:1000px;margin:0 auto;padding:52px 20px 90px;text-align:center}
h1,h2{letter-spacing:-.045em;line-height:1.08}
h1{font-size:clamp(42px,7vw,76px);font-weight:900;margin:12px 0 16px;color:#17130f}
h2{font-size:clamp(25px,4vw,39px);font-weight:850;margin:8px 0 24px}
p{line-height:1.55;color:#6d675f}
.tag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#716b63;background:#eae4db;border:1px solid #ddd6cc;padding:9px 14px;border-radius:999px}
.panel{background:#fff;color:#17130f;border:1px solid #ddd6cc;border-radius:24px;padding:clamp(20px,4vw,38px);margin:22px auto;max-width:760px;box-shadow:0 12px 36px #241c1210}
.panel h2{color:#17130f}
button,input,select{font:inherit;border-radius:13px;padding:14px;border:1px solid #ddd6cc}
input,select{width:100%;margin:7px 0;background:#fff;color:#17130f}
input:focus,select:focus,button:focus-visible{outline:3px solid #a8b7a9;outline-offset:2px}
button{cursor:pointer;background:#17130f;color:#fff;font-weight:800;border:1px solid #17130f;margin:6px;min-height:48px;transition:transform .15s ease,background .15s ease}
button:hover:not(:disabled){transform:translateY(-1px);background:#36302a}
button:disabled{opacity:.52;cursor:default}
.secondary{background:#fff;color:#17130f;border-color:#d9d2c9}
.secondary:hover:not(:disabled){background:#f1ece5}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.choices button{min-height:94px;text-align:left;font-size:clamp(16px,2vw,21px);background:#f7f4ef;color:#17130f;border:1px solid #ddd6cc;margin:0;padding:20px}
.choices button:hover:not(:disabled){background:#eae4db}
.choices button.picked{background:#e6e1d3;border:2px solid #615947}
.choices button.correct{background:#e5f3e9;border:2px solid #237445;color:#15542f}
.choices button.wrong{background:#fbe8e5;border:2px solid #b53f34;color:#81291f}
.score{display:flex;justify-content:space-between;align-items:center;padding:16px 8px;border-bottom:1px solid #e9e3db;gap:12px;text-align:left}
.score:last-child{border-bottom:0}
.muted{opacity:.7}
.big{font-size:64px;font-weight:900;color:#17130f}
.code{font-size:clamp(40px,8vw,84px);letter-spacing:.15em;font-weight:900;color:#17130f}
.host-controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.notice{color:#9c352e;font-weight:700}
.round{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6d675f;font-weight:900;margin-bottom:16px}
.mini{font-size:14px}
.hide{display:none}
@media(max-width:550px){main{padding:30px 14px 70px}.choices{grid-template-columns:1fr;gap:9px}.panel{padding:20px}.choices button{min-height:68px;padding:15px}.score{font-size:14px}}
</style></head><body><main><div class="tag">Faith • Love • Laughter</div><h1>✦ Bible Battle ✦</h1><p>COUPLES GAME NIGHT · 3 COUPLES · 2 BATTLE MODES</p><div id="root"><div class="panel"><h2>Welcome to Game Night</h2><button id="create">Host a Game</button><button id="join">Join from Your Phone</button></div></div><p id="error" class="notice" role="alert"></p></main><script>
const QUESTIONS=[["Who built the ark?",["Moses","Noah","Abraham","David"],1,"Genesis 6"],["What was Jesus' first recorded miracle?",["Walking on water","Healing a blind man","Turning water into wine","Feeding 5,000"],2,"John 2:1–11"],["Who was swallowed by a great fish?",["Jonah","Elijah","Peter","Paul"],0,"Jonah 1:17"],["How many disciples did Jesus choose as apostles?",["7","10","12","14"],2,"Luke 6:13"],["Who defeated Goliath?",["Solomon","David","Samson","Joshua"],1,"1 Samuel 17"],["Who was Ruth's mother-in-law?",["Sarah","Esther","Naomi","Miriam"],2,"Ruth 1"],["Which couple was visited by angels before Sodom was destroyed?",["Isaac and Rebekah","Lot and his wife","Abraham and Sarah","Jacob and Rachel"],2,"Genesis 18"],["Who interpreted Pharaoh's dreams in Egypt?",["Daniel","Joseph","Moses","Aaron"],1,"Genesis 41"],["Who was the first king of Israel?",["David","Saul","Solomon","Samuel"],1,"1 Samuel 10"],["Who was the husband of Priscilla?",["Aquila","Apollos","Silas","Barnabas"],0,"Acts 18:2"],["Which woman became queen and helped save her people?",["Deborah","Esther","Hannah","Abigail"],1,"Esther 4–8"],["Who was instructed to marry Gomer?",["Isaiah","Hosea","Jeremiah","Ezekiel"],1,"Hosea 1:2–3"],["Who was the father of John the Baptist?",["Joseph","Zechariah","Simeon","Nicodemus"],1,"Luke 1"],["Which judge made a vow concerning whoever came out of his house?",["Gideon","Samson","Jephthah","Ehud"],2,"Judges 11"],["What were the names of the couple who lied about proceeds from land?",["Aquila and Priscilla","Ananias and Sapphira","Abraham and Sarah","Isaac and Rebekah"],1,"Acts 5"],["Who was Paul's companion imprisoned with him at Philippi?",["Barnabas","Timothy","Silas","Titus"],2,"Acts 16:25"],["Which prophet confronted David about Bathsheba?",["Samuel","Nathan","Elijah","Gad"],1,"2 Samuel 12"],["Who was the mother of Samuel?",["Hannah","Rachel","Leah","Elizabeth"],0,"1 Samuel 1"],["In Revelation, which church was called lukewarm?",["Ephesus","Smyrna","Philadelphia","Laodicea"],3,"Revelation 3:14–16"],["Who said, 'As for me and my house, we will serve the LORD'?",["Moses","Joshua","David","Nehemiah"],1,"Joshua 24:15"]];
const db=supabase.createClient('https://jjzjqjvdnaeuftptvmyw.supabase.co','sb_publishable_QPQY6u-wJBKULuaEgsG4lA_KiWCwhN4');
const root=document.getElementById('root'),error=document.getElementById('error');let state=null,identity=JSON.parse(sessionStorage.getItem('bibleIdentity')||'null'),timer=null,busy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,payload={}){const {data,error:e}=await db.rpc('couples_bible_action',{action,payload});if(e)throw Error(e.message);if(data?.error)throw Error(data.error);return data}
function fail(e){error.textContent=e.message||String(e);setTimeout(()=>error.textContent='',6000)}
function save(){sessionStorage.setItem('bibleIdentity',JSON.stringify(identity))}
function screen(s){root.innerHTML=s}
function intro(){screen('<div class="panel"><h2>Welcome to Game Night</h2><button id="create">Host a Game</button><button id="join">Join from Your Phone</button></div>');document.getElementById('create').onclick=create;document.getElementById('join').onclick=joinForm}
async function create(){try{const x=await api('create');identity={host:true,room:x.room,code:x.code,hostKey:x.hostKey};save();history.replaceState({},'',location.pathname+'?room='+x.code);await refresh()}catch(e){fail(e)}}
function joinForm(){const code=new URLSearchParams(location.search).get('room')||'';screen('<div class="panel"><h2>Join Bible Battle</h2><input id="code" placeholder="6-character room code" maxlength="6" value="'+esc(code)+'"><input id="name" placeholder="Your first name" maxlength="32"><select id="couple"><option value="1">The Whites</option><option value="2">The Boones</option><option value="3">The Prelows</option></select><select id="side"><option value="men">Men</option><option value="women">Women</option></select><button id="go">Join Game</button></div>');document.getElementById('go').onclick=async()=>{try{const code=document.getElementById('code').value.trim().toUpperCase(),name=document.getElementById('name').value.trim(),couple=+document.getElementById('couple').value,side=document.getElementById('side').value;if(!name||!code)throw Error('Enter your name and room code');const s=await api('state',{code});const p=await api('join',{room:s.room,name,couple,side});identity={room:s.room,code,player:p.player,playerKey:p.playerKey,name};save();history.replaceState({},'',location.pathname+'?room='+code);await refresh()}catch(e){fail(e)}}}
function points(){const players=state.players||[],answers=state.answers||[];return players.map(p=>({...p,score:answers.filter(a=>a.player===p.id&&(a.index<state.index||state.reveal&&a.index===state.index||state.stage==='finished')).reduce((n,a)=>n+(a.points||0),0)}))}
function board(){const ps=points(),names=state.mode==='couples'?['The Whites','The Boones','The Prelows']:['Men','Women'];const values=names.map((name,i)=>({name,score:ps.filter(p=>state.mode==='couples'?p.couple===i+1:p.side===name.toLowerCase()).reduce((n,p)=>n+p.score,0)})).sort((a,b)=>b.score-a.score);return '<div class="panel"><h2>🏆 '+(state.mode==='couples'?'Couples Leaderboard':'Men vs. Women')+'</h2>'+values.map((x,i)=>'<div class="score"><strong>'+(i+1)+'. '+x.name+'</strong><strong>'+x.score+' pts</strong></div>').join('')+'</div>'}
function qr(){const url=location.origin+location.pathname+'?room='+state.code;return '<img width="190" height="190" alt="QR code to join" src="https://api.qrserver.com/v1/create-qr-code/?size=190x190&data='+encodeURIComponent(url)+'"><p class="mini">Or open <strong>'+esc(location.host+location.pathname)+'</strong></p>'}
function teamLabel(v){return v?.startsWith('couple-')?(['The Whites','The Boones','The Prelows'][Number(v.split('-')[1])-1]||v):v==='men'?'Men':'Women'}
function myTurn(){const me=(state.players||[]).find(p=>p.id===identity?.player);return me&&(state.index===0?(state.mode==='couples'?'couple-'+me.couple:me.side)===state.chooser:me.id===state.chooserPlayer)}
function render(){if(!state)return;const host=identity?.host,ps=state.players||[],idx=state.index,q=state.question;let content='';
if(state.stage==='lobby'){content='<div class="panel"><h2>Waiting for Players</h2><div class="code">'+esc(state.code)+'</div>'+qr()+'<p>'+ps.length+' of 6 players joined</p>'+ps.map(p=>'<div class="score"><span>'+esc(p.name)+'</span><span>Couple '+p.couple+' · '+esc(p.side)+'</span></div>').join('')+(host?'<button id="start">Choose Opening Team & Start</button>':'<p>Waiting for the host to start…</p>')+'</div>'}
else if(state.stage==='finished'){content='<div class="panel"><h2>🎉 Bible Battle Champions</h2><p>20 questions complete!</p></div>'+board()+(host?'<button id="restart">Play Again</button>':'')}
else if(state.stage==='choosing'){const canChoose=!host&&myTurn();content='<div class="panel"><div class="round">Question '+(idx+1)+' of 20</div><h2>📖 '+esc(teamLabel(state.chooser))+' chooses the next book!</h2>'+(idx===0?'<p>Randomly selected to open Bible Battle.</p>':'<p>The highest-scoring individual on the last question chooses. Ties are decided randomly.</p>')+(canChoose?(!state.testament&&idx===0?'<h2>Choose a Testament</h2><p>The first question will be randomly selected from your chosen Testament.</p><button data-testament="Old Testament">Old Testament</button><button data-testament="New Testament">New Testament</button>':'<p>Pick a specific book for the next question:</p><div class="choices">'+(state.books||[]).map(book=>'<button data-book="'+esc(book)+'">'+esc(book)+'</button>').join('')+'</div>'):'<p>Waiting for '+esc(idx===0?teamLabel(state.chooser):(ps.find(p=>p.id===state.chooserPlayer)?.name||'selected player'))+' to choose on their phone…</p>')+'</div>'+board()}
else if(state.stage==='playing'&&q){const answered=state.answers.filter(a=>a.index===idx),mine=answered.find(a=>a.player===identity?.player);content='<div class="panel"><div class="round">'+esc(state.book)+' · Round '+(Math.floor(idx/5)+1)+' · Question '+(idx+1)+' of 20'+(idx>=15?' · DOUBLE POINTS':'')+'</div><h2>'+esc(q.text)+'</h2><div class="choices">'+q.choices.map((opt,i)=>'<button data-choice="'+i+'" '+(!host&&(mine||state.reveal)?'disabled':'')+' class="'+(state.reveal?(i===q.correct?'correct':mine?.choice===i?'wrong':''):mine?.choice===i?'picked':'')+'">'+String.fromCharCode(65+i)+'. '+esc(opt)+'</button>').join('')+'</div>'+(state.reveal?'<p><strong>Correct answer:</strong> '+esc(q.choices[q.correct])+'<br><span class="muted">'+esc(q.reference)+'</span></p>':host?'<p>'+answered.length+' / '+ps.length+' answers submitted · Speed scoring active</p>':mine?'<p>✓ Answer locked in! Faster correct answers earn more points.</p>':'<p>Answer quickly! Correct answers start at 1,000 points and decrease by 30 per second (minimum 100).</p>')+'</div>'+board();if(host)content+='<div class="host-controls">'+(!state.reveal?'<button id="reveal">Reveal Answer</button>':'<button id="next">'+(idx===19?'Finish Game':'Award Book Choice →')+'</button>')+'</div>'}
if(host)content='<div class="host-controls">'+(state.stage==='lobby'?'<button id="mode" class="secondary">Mode: '+(state.mode==='couples'?'Couples vs Couples':'Men vs Women')+' ⇄</button>':'<span class="mini">Mode: '+(state.mode==='couples'?'Couples vs Couples':'Men vs Women')+'</span>')+'<span class="mini">Host controls · Display on TV</span></div>'+content;
screen(content);
if(host){document.getElementById('mode')?.addEventListener('click',()=>control({mode:state.mode==='couples'?'menwomen':'couples'}));document.getElementById('start')?.addEventListener('click',()=>control({stage:'choosing'}));document.getElementById('reveal')?.addEventListener('click',()=>control({reveal:true}));document.getElementById('next')?.addEventListener('click',()=>control(idx===19?{stage:'finished'}:{next:true}));document.getElementById('restart')?.addEventListener('click',()=>control({stage:'lobby'}))}
if(!host&&state.stage==='choosing'&&myTurn()){document.querySelectorAll('[data-testament]').forEach(el=>el.onclick=async()=>{try{await api('choose',{room:identity.room,player:identity.player,playerKey:identity.playerKey,testament:el.dataset.testament});await refresh()}catch(e){fail(e)}});document.querySelectorAll('[data-book]').forEach(el=>el.onclick=async()=>{try{await api('choose',{room:identity.room,player:identity.player,playerKey:identity.playerKey,book:el.dataset.book});await refresh()}catch(e){fail(e)}})}
if(!host&&state.stage==='playing'&&!state.reveal&&!state.answers.some(a=>a.player===identity.player&&a.index===idx)){document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=async()=>{if(busy)return;busy=true;try{await api('answer',{room:identity.room,player:identity.player,playerKey:identity.playerKey,index:idx,choice:+el.dataset.choice});await refresh()}catch(e){fail(e)}finally{busy=false}})}
}
async function control(p){try{await api('host',{room:identity.room,hostKey:identity.hostKey,...p});await refresh()}catch(e){fail(e)}}
async function refresh(){if(!identity)return;try{const next=await api('state',{code:identity.code});const changed=JSON.stringify(next)!==JSON.stringify(state);state=next;if(changed)render()}catch(e){fail(e)}}
const code=new URLSearchParams(location.search).get('room');if(identity&&(!code||code===identity.code)){refresh();timer=setInterval(refresh,1300)}else{identity=null;intro();if(code)joinForm();timer=setInterval(()=>{if(identity)refresh()},1300)}
</script></body></html>
