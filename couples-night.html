<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Battle • Couples Game Night</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f9f2dc;background:#102e2a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#285a4e,#102e2a 70%)}main{max-width:960px;margin:auto;padding:35px 18px;text-align:center}h1{font-family:Georgia,serif;font-size:clamp(38px,7vw,76px);margin:14px 0;color:#f8db9b}h2{font-family:Georgia,serif;font-size:clamp(24px,4vw,42px)}p{line-height:1.6}.tag{letter-spacing:.25em;text-transform:uppercase;color:#d2b67b;font-size:12px}.panel{background:#fffdf3;color:#193d35;border-radius:20px;padding:24px;margin:18px auto;max-width:680px;box-shadow:0 14px 40px #071e1a55}.panel h2{color:#163e35}button,input,select{font:inherit;border-radius:12px;padding:14px;border:1px solid #b9c9c2}input,select{width:100%;margin:7px 0;background:white;color:#14352e}button{cursor:pointer;background:#d9b56b;color:#17382f;font-weight:800;border:0;margin:6px;min-height:46px}button:disabled{opacity:.45;cursor:default}.secondary{background:#e3ebe5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{min-height:90px;text-align:left;font-size:clamp(16px,2vw,22px);background:#e8efe9}.choices button.picked{background:#caa75f}.choices button.correct{background:#9cd8ae}.choices button.wrong{background:#f2ac9d}.score{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #d9e0da;gap:12px}.muted{opacity:.7}.big{font-size:64px;font-weight:900;color:#cba760}.code{font-size:clamp(42px,8vw,86px);letter-spacing:.15em;font-weight:900}.host-controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}.notice{color:#d9b56b}.round{font-size:13px;letter-spacing:.2em;text-transform:uppercase}.mini{font-size:14px}.hide{display:none}@media(max-width:550px){.choices{grid-template-columns:1fr}.panel{padding:18px}.choices button{min-height:70px}}</style></head><body><main><div class="tag">Faith • Love • Laughter</div><h1>✦ Bible Battle ✦</h1><p>COUPLES GAME NIGHT · 3 COUPLES · 2 BATTLE MODES</p><div id="root"><div class="panel"><h2>Welcome to Game Night</h2><button id="create">Host a Game</button><button id="join">Join from Your Phone</button></div></div><p id="error" class="notice" role="alert"></p></main><script>
const QUESTIONS=[["Who built the ark?",["Moses","Noah","Abraham","David"],1,"Genesis 6"],["What was Jesus' first recorded miracle?",["Walking on water","Healing a blind man","Turning water into wine","Feeding 5,000"],2,"John 2:1–11"],["Who was swallowed by a great fish?",["Jonah","Elijah","Peter","Paul"],0,"Jonah 1:17"],["How many disciples did Jesus choose as apostles?",["7","10","12","14"],2,"Luke 6:13"],["Who defeated Goliath?",["Solomon","David","Samson","Joshua"],1,"1 Samuel 17"],["Who was Ruth's mother-in-law?",["Sarah","Esther","Naomi","Miriam"],2,"Ruth 1"],["Which couple was visited by angels before Sodom was destroyed?",["Isaac and Rebekah","Lot and his wife","Abraham and Sarah","Jacob and Rachel"],2,"Genesis 18"],["Who interpreted Pharaoh's dreams in Egypt?",["Daniel","Joseph","Moses","Aaron"],1,"Genesis 41"],["Who was the first king of Israel?",["David","Saul","Solomon","Samuel"],1,"1 Samuel 10"],["Who was the husband of Priscilla?",["Aquila","Apollos","Silas","Barnabas"],0,"Acts 18:2"],["Which woman became queen and helped save her people?",["Deborah","Esther","Hannah","Abigail"],1,"Esther 4–8"],["Who was instructed to marry Gomer?",["Isaiah","Hosea","Jeremiah","Ezekiel"],1,"Hosea 1:2–3"],["Who was the father of John the Baptist?",["Joseph","Zechariah","Simeon","Nicodemus"],1,"Luke 1"],["Which judge made a vow concerning whoever came out of his house?",["Gideon","Samson","Jephthah","Ehud"],2,"Judges 11"],["What were the names of the couple who lied about proceeds from land?",["Aquila and Priscilla","Ananias and Sapphira","Abraham and Sarah","Isaac and Rebekah"],1,"Acts 5"],["Who was Paul's companion imprisoned with him at Philippi?",["Barnabas","Timothy","Silas","Titus"],2,"Acts 16:25"],["Which prophet confronted David about Bathsheba?",["Samuel","Nathan","Elijah","Gad"],1,"2 Samuel 12"],["Who was the mother of Samuel?",["Hannah","Rachel","Leah","Elizabeth"],0,"1 Samuel 1"],["In Revelation, which church was called lukewarm?",["Ephesus","Smyrna","Philadelphia","Laodicea"],3,"Revelation 3:14–16"],["Who said, 'As for me and my house, we will serve the LORD'?",["Moses","Joshua","David","Nehemiah"],1,"Joshua 24:15"]];
const db=supabase.createClient('https://jjzjqjvdnaeuftptvmyw.supabase.co','sb_publishable_QPQY6u-wJBKULuaEgsG4lA_KiWCwhN4');
const root=document.getElementById('root'),error=document.getElementById('error');let state=null,identity=JSON.parse(sessionStorage.getItem('bibleIdentity')||'null'),timer=null,busy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,payload={}){const {data,error:e}=await db.rpc('couples_bible_action',{action,payload});if(e)throw Error(e.message);if(data?.error)throw Error(data.error);return data}
function fail(e){error.textContent=e.message||String(e);setTimeout(()=>error.textContent='',6000)}
function save(){sessionStorage.setItem('bibleIdentity',JSON.stringify(identity))}
function screen(s){root.innerHTML=s}
function intro(){screen('<div class="panel"><h2>Welcome to Game Night</h2><button id="create">Host a Game</button><button id="join">Join from Your Phone</button></div>');document.getElementById('create').onclick=create;document.getElementById('join').onclick=joinForm}
async function create(){try{const x=await api('create');identity={host:true,room:x.room,code:x.code,hostKey:x.hostKey};save();history.replaceState({},'',location.pathname+'?room='+x.code);await refresh()}catch(e){fail(e)}}
function joinForm(){const code=new URLSearchParams(location.search).get('room')||'';screen('<div class="panel"><h2>Join Bible Battle</h2><input id="code" placeholder="6-character room code" maxlength="6" value="'+esc(code)+'"><input id="name" placeholder="Your first name" maxlength="32"><select id="couple"><option value="1">Couple 1 — Host & Iesha</option><option value="2">Couple 2</option><option value="3">Couple 3</option></select><select id="side"><option value="men">Men</option><option value="women">Women</option></select><button id="go">Join Game</button></div>');document.getElementById('go').onclick=async()=>{try{const code=document.getElementById('code').value.trim().toUpperCase(),name=document.getElementById('name').value.trim(),couple=+document.getElementById('couple').value,side=document.getElementById('side').value;if(!name||!code)throw Error('Enter your name and room code');const s=await api('state',{code});const p=await api('join',{room:s.room,name,couple,side});identity={room:s.room,code,player:p.player,playerKey:p.playerKey,name};save();history.replaceState({},'',location.pathname+'?room='+code);await refresh()}catch(e){fail(e)}}}
function points(){const players=state.players||[],answers=state.answers||[];return players.map(p=>({...p,score:answers.filter(a=>a.player===p.id&&(a.index<state.index||state.reveal&&a.index===state.index)&&QUESTIONS[a.index]&&QUESTIONS[a.index][2]===a.choice).reduce((n,a)=>n+(a.index>=15?200:100),0)}))}
function board(){const ps=points(),names=state.mode==='couples'?['Couple 1','Couple 2','Couple 3']:['Men','Women'];const values=names.map((name,i)=>({name,score:ps.filter(p=>state.mode==='couples'?p.couple===i+1:p.side===name.toLowerCase()).reduce((n,p)=>n+p.score,0)})).sort((a,b)=>b.score-a.score);return '<div class="panel"><h2>🏆 '+(state.mode==='couples'?'Couples Leaderboard':'Men vs. Women')+'</h2>'+values.map((x,i)=>'<div class="score"><strong>'+(i+1)+'. '+x.name+'</strong><strong>'+x.score+' pts</strong></div>').join('')+'</div>'}
function qr(){const url=location.origin+location.pathname+'?room='+state.code;return '<img width="190" height="190" alt="QR code to join" src="https://api.qrserver.com/v1/create-qr-code/?size=190x190&data='+encodeURIComponent(url)+'"><p class="mini">Or open <strong>'+esc(location.host+location.pathname)+'</strong></p>'}
function render(){if(!state)return;const host=identity?.host,ps=state.players||[],idx=state.index,q=QUESTIONS[idx];let content='';
if(state.stage==='lobby'){content='<div class="panel"><h2>Waiting for Players</h2><div class="code">'+esc(state.code)+'</div>'+qr()+'<p>'+ps.length+' of 6 players joined</p>'+ps.map(p=>'<div class="score"><span>'+esc(p.name)+'</span><span>Couple '+p.couple+' · '+esc(p.side)+'</span></div>').join('')+(host?'<button id="start">Start Bible Battle</button>':'<p>Waiting for the host to start…</p>')+'</div>'}
else if(state.stage==='finished'){content='<div class="panel"><h2>🎉 Bible Battle Champions</h2><p>20 questions complete!</p></div>'+board()+(host?'<button id="restart">Play Again</button>':'')}
else{const answered=state.answers.filter(a=>a.index===idx),mine=answered.find(a=>a.player===identity?.player);content='<div class="panel"><div class="round">Round '+(Math.floor(idx/5)+1)+' · Question '+(idx+1)+' of 20'+(idx>=15?' · DOUBLE POINTS':'')+'</div><h2>'+esc(q[0])+'</h2><div class="choices">'+q[1].map((opt,i)=>'<button data-choice="'+i+'" '+(!host&&(mine||state.reveal)?'disabled':'')+' class="'+(state.reveal?(i===q[2]?'correct':mine?.choice===i?'wrong':''):mine?.choice===i?'picked':'')+'">'+String.fromCharCode(65+i)+'. '+esc(opt)+'</button>').join('')+'</div>'+(state.reveal?'<p><strong>Correct answer:</strong> '+esc(q[1][q[2]])+'<br><span class="muted">'+esc(q[3])+'</span></p>':host?'<p>'+answered.length+' / '+ps.length+' answers submitted</p>':mine?'<p>✓ Answer submitted. Waiting for reveal.</p>':'<p>Select your answer!</p>')+'</div>'+board();if(host)content+='<div class="host-controls">'+(!state.reveal?'<button id="reveal">Reveal Answer</button>':'<button id="next">'+(idx===19?'Finish Game':'Next Question →')+'</button>')+'</div>'}
if(host)content='<div class="host-controls"><button id="mode" class="secondary">Mode: '+(state.mode==='couples'?'Couples vs Couples':'Men vs Women')+' ⇄</button><span class="mini">Host controls · Display on TV</span></div>'+content;
screen(content);
if(host){document.getElementById('mode').onclick=()=>control({mode:state.mode==='couples'?'menwomen':'couples'});document.getElementById('start')?.addEventListener('click',()=>control({stage:'playing',index:0,reveal:false}));document.getElementById('reveal')?.addEventListener('click',()=>control({reveal:true}));document.getElementById('next')?.addEventListener('click',()=>control(idx===19?{stage:'finished'}:{index:idx+1,reveal:false}));document.getElementById('restart')?.addEventListener('click',()=>control({stage:'lobby',index:0,reveal:false}))}
if(!host&&state.stage==='playing'&&!state.reveal&&!state.answers.some(a=>a.player===identity.player&&a.index===idx)){document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=async()=>{if(busy)return;busy=true;try{await api('answer',{room:identity.room,player:identity.player,playerKey:identity.playerKey,index:idx,choice:+el.dataset.choice});await refresh()}catch(e){fail(e)}finally{busy=false}})}
}
async function control(p){try{await api('host',{room:identity.room,hostKey:identity.hostKey,...p});await refresh()}catch(e){fail(e)}}
async function refresh(){if(!identity)return;try{const next=await api('state',{code:identity.code});const changed=JSON.stringify(next)!==JSON.stringify(state);state=next;if(changed)render()}catch(e){fail(e)}}
const code=new URLSearchParams(location.search).get('room');if(identity&&(!code||code===identity.code)){refresh();timer=setInterval(refresh,1300)}else{identity=null;intro();if(code)joinForm();timer=setInterval(()=>{if(identity)refresh()},1300)}
</script></body></html>
