<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapid Orbit | The Medic Goats</title><style>body{margin:0;background:#f5f3e9;color:#163e3b;font-family:system-ui;text-align:center}header{background:#14514d;color:#fff;padding:20px;font-size:23px;font-weight:800}main{max-width:800px;margin:auto;padding:18px}button{background:#a66b3f;color:white;border:0;border-radius:10px;padding:14px 25px;font-size:18px;font-weight:700}#board{display:grid;gap:7px;max-width:700px;margin:18px auto}.orbit{aspect-ratio:1;position:relative;border:2px solid #82aaa3;border-radius:50%;background:#fff;min-width:0;touch-action:manipulation;cursor:pointer}.orbit:after{content:'';position:absolute;left:45%;top:45%;width:10%;height:10%;background:#b37b48;border-radius:50%}.arm{position:absolute;inset:0;animation:spin var(--speed) linear infinite}.arm.reverse{animation-direction:reverse}.arm:before{content:'';position:absolute;top:6%;left:41%;width:18%;height:18%;border-radius:50%;background:#b37b48}@keyframes spin{to{transform:rotate(360deg)}}.stats{display:flex;justify-content:space-around;font-weight:700}#message{min-height:28px;font-weight:700}</style><header>THE MEDIC GOATS · RAPID ORBIT</header><main><h2>Find the backward circle</h2><p>Only one orbit moves in the opposite direction. Tap it as fast as you can!</p><div class="stats"><span id="level">Level 1</span><span id="score">Score: 0</span><span id="time">10.0s</span></div><p><button id="start">Start Game</button></p><p id="message">Ready?</p><div id="board"></div><small>Private test — not listed in Games</small></main><script>const counts=[6,12,20,35,50,70,90,120,150,180],board=document.getElementById('board'),start=document.getElementById('start'),message=document.getElementById('message');let level=0,score=0,correct=-1,deadline=0,timer=null,active=false;function end(){active=false;clearInterval(timer)}function round(){end();const count=counts[level];correct=Math.floor(Math.random()*count);board.replaceChildren();board.style.gridTemplateColumns='repeat('+Math.ceil(Math.sqrt(count*1.25))+',minmax(0,1fr))';document.getElementById('level').textContent='Level '+(level+1);document.getElementById('score').textContent='Score: '+score;for(let i=0;i<count;i++){const circle=document.createElement('div');circle.className='orbit';circle.setAttribute('role','button');circle.setAttribute('aria-label','Circle '+(i+1));const arm=document.createElement('div');arm.className='arm'+(i===correct?' reverse':'');arm.style.setProperty('--speed',Math.max(1.7,3.4-level*.13)+'s');circle.append(arm);circle.onclick=()=>choose(i);board.append(circle)}message.textContent='Find the backward orbit!';deadline=performance.now()+10000;active=true;timer=setInterval(()=>{const left=Math.max(0,(deadline-performance.now())/1000);document.getElementById('time').textContent=left.toFixed(1)+'s';if(left<=0){end();message.textContent='Time up! Score: '+score;start.textContent='Try Again';start.hidden=false}},50)}function choose(i){if(!active)return;if(i!==correct){deadline-=1500;message.textContent='Wrong circle! −1.5 seconds';return}const earned=Math.round(100+Math.max(0,(deadline-performance.now())/1000)*90);score+=earned;end();message.textContent='Correct! +'+earned+' points';if(level===counts.length-1){message.textContent='GOAT MODE COMPLETE! Final score: '+score;start.textContent='Play Again';start.hidden=false}else{level++;setTimeout(round,700)}}start.onclick=()=>{level=0;score=0;start.hidden=true;round()};</script></html>
